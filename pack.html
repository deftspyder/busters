<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010806">
<title>LAGB Proton Pack Monitor</title>
<meta name="description" content="Los Angeles Ghostbusters proton pack diagnostics, a demo of the Busters pack monitor.">
<link rel="icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#010806;color:#4dff9a;font-family:"Share Tech Mono",ui-monospace,Menlo,monospace}
  .again{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
  .again button{font:inherit;font-size:16px;letter-spacing:.12em;color:#4dff9a;background:#000;border:1px solid #4dff9a;border-radius:10px;padding:14px 22px;cursor:pointer;box-shadow:0 0 14px #4dff9a55}
  .again p{opacity:.7;font-size:13px;letter-spacing:.08em;margin-top:14px}
</style>
</head>
<body>
<div class="again"><div><button id="go">POWER UP PACK</button><p>LOS ANGELES GHOSTBUSTERS // TAP TO START, SOUND ON</p></div></div>
<script src="pack.js?v=28"></script>
<script>
// Public demo of the Busters pack monitor: no sign-in and no member data. The name comes from the link,
// e.g. pack.html?name=Bill%20Palmatary
(() => {
  const q = new URLSearchParams(location.search);
  const name = (q.get('name') || 'Demo Buster').slice(0, 60);
  const me = { id: 'demo-' + name, full_name: name, status: 'active' };
  const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const $ = (sel, root = document) => root.querySelector(sel);
  let tt; const toast = m => { clearTimeout(tt); let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;background:#fff;color:#000;padding:10px 14px;border-radius:10px;font:14px system-ui'; document.body.appendChild(t); } t.textContent = m; tt = setTimeout(() => t.remove(), 3000); };
  const S = {
    crew: { short: 'LAGB' }, me, people: [me], rsvps: [],
    settings: { pack_monitor: {
      diagram: 'img/pack-diagram.jpg?v=2',
      marks: { booster: [31.5, 22], ion_arm: [11.4, 11], power_cell: [8.7, 31.5], ppd: [43.6, 46.2], injectors: [12.8, 59.3], hga: [86.6, 11], crank: [57, 6], cyclotron: [27, 89], n_filter: [67.8, 93], sync_gen: [89.9, 59], heatsink: [91.3, 31], ribbon: [13.4, 79.1] },
      lights: [[39.7, 69.7], [66.8, 69.7], [62.3, 83.5, 40], [43, 83.5, 40]]
    } }
  };
  const ctx = { S, $, esc, toast, rpc: async () => {}, can: () => false, nameOf: p => p.full_name, upcoming: () => [], todayISO: () => new Date().toISOString().slice(0, 10) };
  // Phones only allow sound after a tap, so the monitor opens from this button and makes its sound engine in the tap.
  document.getElementById('go').onclick = () => {
    let audioCtx = null; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume().catch(() => {}); } catch (e) { /* no sound */ }
    window.openPackMonitor({ ...ctx, audioCtx });
  };
})();
</script>
</body>
</html>
