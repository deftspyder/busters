<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Busters</title>
<meta name="description" content="Events, sign-ups and crew tools for the Los Angeles Ghostbusters.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/favicon-64.png?v=2" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Busters">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:#0d0f14;--panel2:#151922;--line:#232a36;--ink:#f3f5f8;--muted:#9aa4b2;--dim:#6b7584;
  --cyan:#35b2e8;--cyan-soft:rgba(53,178,232,.14);--coral:#ff8c78;--pink:#ff5e86;--purple:#9b6fb0;--teal:#3ba7c0;--cream:#f7e3a0;
  --hazard:#ffd400;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;
  --sunset:linear-gradient(90deg,var(--coral),var(--pink) 35%,var(--purple) 70%,var(--teal));
  --r:14px;--pad:16px;--tabh:64px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.04em;margin:0}
h2{font-size:26px}h3{font-size:20px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.tiny{font-size:12px}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.top .bar{display:flex;align-items:center;gap:12px;height:56px;max-width:760px;margin:0 auto;padding:0 var(--pad)}
.top .logo{height:26px;flex:0 0 auto}
.top .sp{flex:1}
.hz{height:10px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#111 10px 20px)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sunset);color:#000;font-weight:700;display:grid;place-items:center;font-size:14px;border:0;cursor:pointer}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#08090c;padding-bottom:env(safe-area-inset-bottom)}
.tabs .tabs-in{display:flex;max-width:760px;margin:0 auto;padding:0 8px}
.tab{flex:1;height:var(--tabh);border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:#bfeaff;text-shadow:0 0 4px var(--cyan),0 0 10px var(--cyan),0 0 18px rgba(53,178,232,.6);background:radial-gradient(ellipse 60% 70% at 50% 55%,rgba(53,178,232,.16),transparent 75%)}
.tab::after{content:"";position:absolute;inset:6px 0 6px;border:1px solid var(--line);border-left:0;border-bottom:0;pointer-events:none;transition:border-color .15s,box-shadow .15s}
.tab:first-child::after{border-left:1px solid var(--line);border-top-left-radius:14px}
.tab:last-child::after{border-top-right-radius:14px}
.tab.on:first-child::after{left:0}
.tab.on::after{left:-1px;z-index:1;border-left:1px solid;border-color:rgba(255,190,120,.9);box-shadow:0 0 6px #ff9a3c,0 0 14px rgba(255,140,50,.55),inset 0 8px 10px -6px rgba(255,140,50,.5);clip-path:inset(-24px -24px 0 -24px)}
.tab.on svg{filter:drop-shadow(0 0 3px var(--cyan)) drop-shadow(0 0 8px rgba(53,178,232,.7))}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--pink);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;font-weight:700}

/* cards and rows */
.sec{margin:20px 0}
.sec>h2{margin:0 0 10px;display:flex;align-items:center;gap:10px}
.sec>h2 .act{margin-left:auto;font-family:"DM Sans",system-ui,sans-serif;font-size:14px;letter-spacing:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-decoration:none;color:inherit}
.row+.row{margin-top:8px}
.row:hover{border-color:#33404f}
.row .grow{flex:1;min-width:0}
.xrow+.xrow{margin-top:8px}
.xrow .row .grow{flex:1;min-width:0}
.xrow .row.xh{align-items:flex-start}
.xrow .row.xh .xside{flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px}
.xrow .row.xh .xside .chev{margin-top:auto}
.xrow .row.xh .xside .chev:only-child{margin:auto 0}
.xrow .row.xh .pills{flex-wrap:nowrap;overflow:hidden}
.xrow .row.xh .pills .pill{display:inline-block;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.xrow .chev{flex:0 0 auto;color:var(--dim);transform:rotate(-90deg);transition:transform .15s;display:grid}
.xedit{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.xedit:hover{color:var(--cyan);border-color:var(--cyan)}
.xrow.open .chev{transform:rotate(90deg)}
.xrow.open .row{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.xrow.waiting .row{border-color:rgba(248,113,113,.45)}
.xb{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:0 12px 12px}
.xrow.waiting .xb{border-color:rgba(248,113,113,.45)}
.xl{display:flex;align-items:center;gap:10px;padding-top:4px}
.xpl{padding-top:2px}
.xp{display:flex;align-items:center;gap:10px;padding:8px 0}
.xp+.xp{border-top:1px solid var(--line)}
.xl .tl{font-size:14px}
.xb .choices{margin-top:10px}
.xb .xfull{margin-top:10px;width:100%}
.wait{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px 2px 7px;font-size:12px;font-weight:700;color:#fff;background:rgba(248,113,113,.18);border:1px solid var(--bad);animation:waitglow 1.6s ease-in-out infinite}
.wait i{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
@keyframes waitglow{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.0)}50%{box-shadow:0 0 10px 2px rgba(248,113,113,.55)}}
.tab .badge.pulse{background:var(--bad);animation:waitglow 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.wait,.tab .badge.pulse{animation:none}}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox{width:52px;flex:0 0 52px;text-align:center;border-radius:10px;background:var(--panel2);padding:6px 0;line-height:1}
.datebox .m{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.08em}
.datebox .d{font-family:"Bebas Neue";font-size:28px}
.datebox .w{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.pill.good{color:var(--good);border-color:rgba(74,222,128,.35)}
.pill.warn{color:var(--warn);border-color:rgba(251,191,36,.35)}
.pill.bad{color:var(--bad);border-color:rgba(248,113,113,.35)}
.pill.cyan{color:var(--cyan);border-color:rgba(53,178,232,.4)}
.pill.cream{color:var(--cream);border-color:rgba(247,227,160,.35)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qa{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.qa .qal{font-size:12px;font-weight:700;color:var(--muted)}
.qa.hot .qal{color:#f87171}
.qa .qb{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font:700 16px "DM Sans",sans-serif;cursor:pointer;padding:0;display:grid;place-items:center}
.qa .qb.y{border-color:var(--good);color:var(--good)}.qa .qb.m{border-color:var(--warn);color:var(--warn)}.qa .qb.n{color:var(--muted)}
.qa .qb:active{transform:scale(.94)}
.qa .qsp{flex:1}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* buttons and forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#001018}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:rgba(248,113,113,.4);background:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.in,select.in,textarea.in{width:100%;background:#07080b;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.in:focus{border-color:var(--cyan)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2>*,.grid3>*{min-width:0}
input.in{min-width:0}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:#000}
.seg.rsvp button.on.going{background:var(--good);color:#001a08}
.seg.rsvp button.on.maybe{background:var(--warn);color:#1a1200}
.seg.rsvp button.on.no{background:#3a4352;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--cyan)}

/* home */
.hello{display:flex;align-items:center;gap:8px}
.gbpill{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-size:12px;white-space:nowrap}
.gbpill .ic{color:#f87171}
.mmap{height:300px;background:#0d0f14;position:relative;z-index:0;isolation:isolate}
.gmap{display:block;width:100%;height:380px;border:0}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.pstats div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.pstats b{display:block;font-family:"Bebas Neue";font-size:26px;font-weight:400;line-height:1}
.pstats span{font-size:11px;color:var(--muted)}
.prow2{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.prow2 span{color:var(--cyan);min-width:52px}
.pab{border-top:1px solid var(--line);padding-top:12px}
.crewgrid .row::after{content:"\203A";color:var(--dim);margin-left:auto;font-size:18px;padding-left:4px}
.crewgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.crewgrid .row{margin:0;min-width:0}
.crewgrid .row .grow{min-width:0}
.crewgrid .row .t,.crewgrid .row .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.crewgrid{grid-template-columns:1fr}}
.mtiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.mpin{width:30px;height:30px;border-radius:50%;background:var(--cyan);color:#001018;font:700 13px "DM Sans",sans-serif;display:grid;place-items:center;border:2px solid #001018;box-shadow:0 0 0 4px rgba(56,217,232,.25)}
.mpin.me{background:var(--good);box-shadow:0 0 0 4px rgba(74,222,128,.3)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.mpop a{color:var(--cyan)}.mpop b{display:block;margin-bottom:4px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#8a94a6!important}.leaflet-control-attribution a{color:#8a94a6!important}
.lbrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lbrow .rk{width:22px;text-align:center;color:var(--muted);font-weight:700}
.lbrow.me{background:rgba(56,217,232,.08);border-radius:10px}
.mystripe{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:flex-end}
.mypill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-size:13px;white-space:nowrap}
.mypill b{font-weight:700}
.mypill .pips{display:inline-flex;gap:3px}
.mypill .pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid #3a4352;box-sizing:border-box}
.mypill .pips i.r{border-color:var(--cyan)}
.mypill .pips i.f{background:var(--warn);border-color:var(--warn)}
.mypill.met{border-color:rgba(74,222,128,.45)}
.mypill.met .pips i.f{background:var(--good);border-color:var(--good)}
.next{border:1px solid rgba(53,178,232,.35);background:linear-gradient(180deg,rgba(53,178,232,.10),rgba(53,178,232,0) 60%),var(--panel)}
.pke{display:flex;gap:10px;margin:12px 0}
.pke div{flex:1;background:#07080b;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.pke b{display:block;font-family:"Bebas Neue";font-size:30px;color:var(--cyan);line-height:1}
.pke span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.script{font-family:Yellowtail,cursive;color:var(--cream);font-size:22px}

/* brief */
.gc-title{display:flex;gap:14px;align-items:flex-start;margin:6px 0 6px}
.gc-sq{flex:0 0 auto;width:16px;height:16px;border-radius:4px;margin-top:8px}
.gc-when{font-size:15px;margin-top:4px}
.gc-place{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:8px}
.gc-place .gc-ic{width:16px;height:16px;flex:0 0 16px;color:var(--muted);align-self:flex-start;margin-top:2px}
.gc-sub{font-size:13px;color:var(--muted);margin-top:2px}
.gc-row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.gc-row .gc-ic{flex:0 0 auto;color:var(--muted);margin:1px 0 0 -2px}
.gc-row .navic{margin:-4px 0}
.gc-body{flex:1;min-width:0}
.gc-lbl{font-size:12px;color:var(--muted)}
.gc-names{font-size:14px;line-height:1.6;margin-top:2px}
.ct{display:flex;align-items:center;gap:10px}
.ct-who{flex:1;min-width:0}
.ct-name{background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.ct-num{color:var(--muted);margin-top:3px}
.ct-num a{color:var(--cyan)}
.ct-btns{display:flex;gap:8px;flex:0 0 auto}
.cbtn{width:42px;height:42px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--cyan);display:grid;place-items:center}
.gc-nm{color:var(--ink);text-decoration:none;border-bottom:1px dotted #4a5262}
.gc-nm:hover{color:var(--cyan);border-color:var(--cyan)}
.brief .choices{margin:6px 0 12px}
.brief h1{font-size:28px;line-height:1.05}
.brief .back{margin:8px 0 4px}
.kick{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.when{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.cdate{width:56px;flex:0 0 56px;border-radius:12px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);text-align:center;line-height:1}
.cdate .cm{background:var(--bad);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 0;text-transform:uppercase}
.cdate .cd{font-family:"Bebas Neue";font-size:30px;padding:4px 0 0}
.cdate .cw{font-size:10px;color:var(--muted);padding:0 0 5px;letter-spacing:.06em;text-transform:uppercase}
.when .tl{font-size:15px;margin-bottom:2px}
.navic{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--cyan);color:#001018;display:grid;place-items:center}.navic svg{width:20px;height:20px}
.choices{display:flex;gap:8px;margin-top:12px}
.ans-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:12px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 14px "DM Sans",sans-serif;cursor:pointer}
.ans-sum.going{border-color:rgba(74,222,128,.5);color:var(--good)}.ans-sum.maybe{border-color:rgba(251,191,36,.5);color:var(--warn)}
.ans-sum .ch-l{font-weight:400;font-size:13px;color:var(--muted)}
.brief .ans-sum{margin:6px 0 12px}
.choices .ch{flex:1 1 0;min-width:0;min-height:44px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 6px;font:700 14px "DM Sans",sans-serif;cursor:pointer}
.choices .ch.going{color:var(--good);border-color:rgba(74,222,128,.5)}
.choices .ch.going.on{background:var(--good);color:#001a08;border-color:var(--good)}
.choices .ch.maybe.on{background:var(--warn);color:#1a1200;border-color:var(--warn)}
.choices .ch.no.on{background:#3a4352;border-color:#3a4352}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ridebox summary{cursor:pointer;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ridebox summary::-webkit-details-marker{display:none}
.grp{margin-top:8px}.grp .gl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.people .pill .nt{color:var(--muted);font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-family:"Bebas Neue";font-size:24px}
.place{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.place+.place{margin-top:8px}
.place .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan)}
.staff{height:10px;border-radius:999px;background:#1b2029;position:relative;overflow:hidden;margin:8px 0}
.staff i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.staff .goalmark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.pre{white-space:pre-wrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.people{display:flex;flex-wrap:wrap;gap:6px}
.missing{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.06)}
.back{display:inline-flex;align-items:center;gap:6px;margin:14px 0 4px;color:var(--muted);cursor:pointer;background:none;border:0;padding:0}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--dim);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:5px;font-size:12px;cursor:pointer;position:relative}
.cal .d.o{opacity:.35}
.cal .d.today{border-color:var(--cyan)}
.cal .d.sel{background:var(--cyan-soft);border-color:var(--cyan)}
.cal .dots{position:absolute;left:5px;right:5px;bottom:5px;display:flex;gap:3px;flex-wrap:wrap}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.cal .dots i.mine{background:var(--good)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px var(--pad) calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.scrim{height:100vh;height:100dvh}
@media (min-width:600px){.scrim{align-items:center;padding:20px}.sheet{border-radius:20px;max-height:calc(100dvh - 40px);padding-bottom:18px}.sheet .grab{display:none}}
@media (min-width:600px){.scrim.right{justify-content:flex-end;align-items:flex-start;padding:64px max(16px,calc((100vw - 760px) / 2 + 16px)) 20px}.scrim.right .sheet{max-width:380px}}
.scrim.full{padding:0}.scrim.full .sheet{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;border:0;display:flex;flex-direction:column;padding:14px 0 calc(14px + env(safe-area-inset-bottom))}
.qrhead{display:flex;align-items:center;padding:0 var(--pad) 10px}.qrhead h3{margin:0;flex:1}
.qrtrack{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px;overflow-y:auto;min-height:0;padding:0 var(--pad)}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qrbox{background:#fff;border-radius:14px;padding:10px;width:min(66vw,calc((100dvh - 300px) / 2),320px);min-width:150px;aspect-ratio:1;display:grid;place-items:center}
.qrbox img,.qrbox svg{width:100%;height:auto;display:block}
.scrim.full .grab{display:none}
.qrcard h2{margin:2px 0 0;font-size:18px}.qrcard .qrsub{font-size:13px}
.qrcard .qrbtns{display:flex;gap:8px}
.dcode{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#2a3240;margin:-6px auto 12px}
.menuitem{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);text-decoration:none}
.menuitem:last-child{border-bottom:0}
.menuitem .grow{flex:1}
.menu-r{text-align:right}
.menu-r .menuitem .grow{text-align:right}

.fab{position:fixed;right:max(16px,calc((100vw - 760px) / 2 + 16px));bottom:calc(var(--tabh) + 40px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--cyan);color:#001018;display:grid;place-items:center;cursor:pointer;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.fab:active{transform:scale(.95)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom));background:var(--ink);color:#000;padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;max-width:90vw}

/* sign in */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px var(--pad) 48px;max-width:440px;margin:0 auto}
.gate .mark{width:min(320px,80%);margin:0 auto 20px}

/* personnel */
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.ptable td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ptable tr{cursor:pointer}
.ptable tr:hover td{background:var(--panel)}
.scrollx{overflow-x:auto}
.log{font-size:13px}
.log div{padding:9px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
'use strict';
const SB_URL = 'https://fwptdvoifkfljblyziva.supabase.co';
const SB_KEY = 'sb_publishable_Cq_YmHplQQL1xqIE6HhCwg_JYSMIFKp';
const CREW_SLUG = new URLSearchParams(location.search).get('crew') || 'lagb';
const DONATE_URL = 'https://donate.starlight.org/fundraiser/3526698';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } });

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.length > 48 ? u.slice(0, 45) + '...' : u}</a>`);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fmtDay = (s, opt = { weekday: 'short', month: 'short', day: 'numeric' }) => s ? parseDay(s).toLocaleDateString('en-US', opt) : '';
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? ' AM' : ' PM'); };
const daysUntil = s => Math.round((parseDay(s) - parseDay(todayISO())) / 86400000);
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const first = n => String(n || '').split(/\s+/)[0];
const tel = p => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
let toastT;
function toast(msg) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) { toast(nice(error.message)); throw error; } return data; }
const nice = m => /not allowed/.test(m) ? "You don't have the ability to do that." : /point of contact/.test(m) ? 'That person cannot be point of contact yet.' : m;

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  events: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  me: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  crew: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2c2.6.2 4.4 1.9 5 4.8"/></svg>',
  team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L6.8 5M3.5 12l1.2 1.2 2.1-2.2M3.5 18l1.2 1.2 2.1-2.2"/></svg>',
  list: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  cal: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  qr: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>',
  menu: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  nav: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>'
};

const ABILITIES = [
  ['add_events', 'Add events', 'Create events'],
  ['edit_events', 'Edit events', 'Change any event'],
  ['manage_proposals', 'Manage proposals', 'Claim proposed events and turn them into events or close them'],
  ['pick_attendees', 'Pick attendees', 'Choose who is In and on Reserve for limited events'],
  ['poc', 'Be point of contact', "Be assigned as an event's POC"],
  ['take_attendance', 'Take attendance', 'Settle who attended after an event'],
  ['approve_members', 'Approve members', 'Let new people in'],
  ['manage_recruits', 'Personnel', 'Personnel roster, contact details, dues and rookies'],
  ['webmaster', 'Webmaster', 'Pick event photos for the website'],
  ['manage_abilities', 'Manage abilities', 'Change what others can do'],
  ['inbox_alerts', 'Inbox alerts', 'Get alerts for group email'],
  ['view_log', 'View action log', 'See who did what'],
  ['crew_admin', 'Crew admin', 'Everything above, plus announcements']
];
const PRESETS = ['Member', 'Events team', 'Personnel', 'Admin'];
const CATEGORIES = ['Hospital', 'Charity', 'Community', 'Parade', 'Convention', 'Run/Walk', 'Private', 'Social', 'Build day'];

/* ---------- state ---------- */
const S = { session: null, crew: null, me: null, priv: null, dues: {}, profile: {}, appAdmin: false,
  events: [], places: [], people: [], rsvps: [], eplaces: [], announcements: [],
  tab: 'home', view: null, evFilter: 'upcoming', evMode: 'list', evSearch: '', calMonth: null, calSel: null };
const can = a => S.appAdmin || (S.me && (S.me.abilities.includes(a) || S.me.abilities.includes('crew_admin')));
const teamAbilities = ['add_events', 'edit_events', 'manage_proposals', 'pick_attendees', 'take_attendance', 'approve_members', 'manage_recruits', 'webmaster', 'view_log', 'crew_admin'];
const onTeam = () => teamAbilities.some(can);
const personById = id => S.people.find(p => p.id === id);
const myRsvp = eid => S.rsvps.find(r => r.event_id === eid && S.me && r.person_id === S.me.id);
const nameOf = p => p ? (p.callsign ? `${p.full_name} (${p.callsign})` : p.full_name) : 'Someone';

/* ---------- boot and sign-in ---------- */
async function boot() {
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  sb.auth.onAuthStateChange((ev, session) => {
    const had = !!S.session; S.session = session;
    if (ev === 'SIGNED_IN' && !had) enter();
    if (ev === 'SIGNED_OUT') renderGate();
  });
  if (!S.session) return renderGate();
  enter();
}

function renderGate(step = 'email', email = '') {
  $('#layer').innerHTML = '';
  $('#app').innerHTML = `<div class="gate">
    <img class="mark" src="img/wordmark-stacked.png" alt="The Los Angeles Ghostbusters">
    <div class="card">
      ${step === 'email' ? `
        <h2>Sign in to Busters</h2>
        <p class="muted small">Use the email the crew has for you. We'll send a sign-in link and a 6-digit code.</p>
        <form id="f"><label class="f"><span>Email</span><input class="in" type="email" name="email" required autocomplete="email" value="${esc(email)}"></label>
        <button class="btn primary block" style="margin-top:14px">Send my link</button></form>` : `
        <h2>Check your email</h2>
        <p class="muted small">We sent a link to <b>${esc(email)}</b>. Tap it on this device, or type the code from the email here.</p>
        <form id="f"><label class="f"><span>6-digit code</span><input class="in" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\\d{6}" required></label>
        <button class="btn primary block" style="margin-top:14px">Sign in</button></form>
        <button class="btn ghost block" id="again" style="margin-top:8px">Use a different email</button>`}
    </div>
    <p class="dim tiny" style="text-align:center;margin-top:18px">Busters is for members of official Ghostbusters franchise crews. New here? Sign in and a crew admin will approve you.</p>
  </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true;
    if (step === 'email') {
      const em = e.target.email.value.trim().toLowerCase();
      const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + location.pathname + location.search } });
      if (error) { toast(error.message); btn.disabled = false; return; }
      renderGate('code', em);
    } else {
      const { error } = await sb.auth.verifyOtp({ email, token: e.target.code.value.trim(), type: 'email' });
      if (error) { toast('That code did not work. Try again or use the link.'); btn.disabled = false; }
    }
  };
  const again = $('#again'); if (again) again.onclick = () => renderGate('email', email);
}

async function enter(name) {
  $('#app').innerHTML = '<div class="gate"><p class="muted" style="text-align:center">Loading...</p></div>';
  let res;
  try { res = await rpc('enter_crew', { p_slug: CREW_SLUG, p_name: name || null }); } catch (e) { return renderGate(); }
  if (res.status === 'need_name') return renderNeedName();
  if (res.status === 'pending') return renderWaiting(res.crew);
  if (res.status === 'declined' || res.status === 'removed' || res.status === 'retired') return renderBlocked(res.status);
  S.crew = { id: res.crew_id, short: res.crew };
  await loadAll();
  if (!S.me) return renderBlocked('removed');
  renderShell();
  const hash = location.hash.slice(1); if (hash.startsWith('event/')) openEvent(hash.slice(6));
}

function renderNeedName() {
  $('#app').innerHTML = `<div class="gate"><img class="mark" src="img/wordmark-stacked.png" alt="">
    <div class="card"><h2>Ask to join</h2>
    <p class="muted small">We don't have this email on the crew list yet. Tell us your name and a crew admin will approve you.</p>
    <form id="f"><label class="f"><span>Your full name</span><input class="in" name="n" required autocomplete="name"></label>
    <button class="btn primary block" style="margin-top:14px">Ask to join</button></form>
    <button class="btn ghost block" id="out" style="margin-top:8px">Sign out</button></div></div>`;
  $('#f').onsubmit = e => { e.preventDefault(); enter(e.target.n.value.trim()); };
  $('#out').onclick = () => sb.auth.signOut();
}
function renderWaiting(crew) {
  $('#app').innerHTML = `<div class="gate"><img class="mark" src="img/wordmark-stacked.png" alt="">
    <div class="card"><h2>Waiting for approval</h2>
    <p class="muted">Your request to join ${esc(crew || 'the crew')} is in. You'll get access as soon as an admin approves it.</p>
    <div class="btns" style="margin-top:12px"><button class="btn" id="re">Check again</button><button class="btn ghost" id="out">Sign out</button></div></div></div>`;
  $('#re').onclick = () => enter(); $('#out').onclick = () => sb.auth.signOut();
}
function renderBlocked(st) {
  $('#app').innerHTML = `<div class="gate"><div class="card"><h2>No access</h2>
    <p class="muted">${st === 'retired' ? 'This account belongs to a retired member. Ask Personnel if you want to come back.' : "This account doesn't have access to the crew."}</p>
    <button class="btn" id="out">Sign out</button></div></div>`;
  $('#out').onclick = () => sb.auth.signOut();
}

/* ---------- data ---------- */
async function loadAll() {
  const c = S.crew.id;
  const since = new Date(Date.now() - 400 * 86400000).toISOString().slice(0, 10);
  const [sess, ev, pl, pe, rs, ep, an, gb, fb, sp, cs] = await Promise.all([
    rpc('my_session', { p_crew: c }),
    sb.from('events_full').select('*').eq('crew_id', c).gte('event_date', since).order('event_date').order('call_time', { nullsFirst: false }),
    sb.from('places').select('*').eq('crew_id', c).order('name'),
    sb.from('people').select('id,full_name,callsign,title,status,abilities,member_since,rookie_since,eligible_date,city,show_on_map,user_id,created_at').eq('crew_id', c).order('full_name'),
    sb.from('rsvps').select('*').eq('crew_id', c),
    sb.from('event_places').select('*').eq('crew_id', c).order('sort'),
    sb.from('announcements').select('*').eq('crew_id', c).order('created_at', { ascending: false }).limit(10),
    sb.rpc('giveback_for_crew', { p_crew: c }),
    sb.rpc('fundraising_board', { p_crew: c, p_year: Number(todayISO().slice(0, 4)) }),
    sb.rpc('shared_phones', { p_crew: c }),
    sb.rpc('crew_settings', { p_crew: c })
  ]);
  S.appAdmin = sess.app_admin; S.me = sess.person; S.priv = sess.private || {}; S.dues = sess.dues || {}; S.profile = sess.profile || {};
  if (S.me && !['active', 'rookie'].includes(S.me.status)) S.me = null;
  S.events = ev.data || []; S.places = pl.data || []; S.people = pe.data || []; S.rsvps = rs.data || []; S.eplaces = ep.data || []; S.announcements = an.data || []; S.gb = (gb && gb.data) || null; S.board = (fb && fb.data) || []; S.settings = (cs && cs.data) || {}; S.phones = Object.fromEntries(((sp && sp.data) || []).map(x => [x.person_id, x.phone]));
}
async function refresh() { await loadAll(); render(); }

/* ---------- shell ---------- */
const TABS = [['home', 'Home'], ['chat', 'Chat'], ['crew', 'Crew'], ['team', 'Team']];
function renderShell() {
  $('#app').innerHTML = `
    <header class="top"><div class="bar">
      <img class="logo" src="img/wordmark-wide.png" alt="The Los Angeles Ghostbusters">
      <div class="sp"></div>
      <button class="iconbtn" id="qr" title="Donate QR codes" aria-label="Donate QR codes">${ICON.qr}</button>
      <button class="avatar" id="av" title="Your profile">${esc(initials(S.me.full_name))}</button>
      <button class="iconbtn" id="menu" title="Menu">${ICON.menu}</button>
    </div><div class="hz"></div></header>
    <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
    <main class="wrap" id="main"></main>`;
  $('#av').onclick = openProfile; $('#menu').onclick = openMenu; $('#qr').onclick = openQR;
  render();
}
function teamCount() {
  const ev = can('add_events') || can('edit_events'); const up = upcoming().filter(e => e.status === 'scheduled');
  return (can('approve_members') ? S.people.filter(p => p.status === 'pending').length : 0)
    + (can('manage_proposals') ? S.events.filter(e => e.status === 'proposed').length : 0)
    + (ev ? up.filter(isShort).length + up.filter(e => e.missing.length).length : 0)
    + (can('pick_attendees') ? up.filter(e => e.max_busters && e.going > 0 && e.spots_in < e.max_busters).length : 0)
    + (can('crew_admin') ? S.events.filter(e => e.status !== 'cancelled' && Number(e.raised) > 0 && !e.credit_published).length : 0);
}
function render() {
  const tabs = TABS.filter(([k]) => k !== 'team' || onTeam());
  const tc = teamCount(); const wc = upcoming().filter(isWaiting).length;
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${S.tab === k && !S.view ? 'on' : ''}" data-t="${k}">${ICON[k]}<span>${l}</span>${k === 'team' && tc ? `<b class="badge">${tc}</b>` : ''}${k === 'home' && wc ? `<b class="badge pulse" title="${wc} waiting on your answer">${wc}</b>` : ''}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.view = null; history.replaceState(null, '', location.pathname); render(); scrollTo(0, 0); });
  const m = $('#main');
  if (S.view) return S.view();
  ({ home: renderHome, events: renderEvents, me: renderMine, chat: renderChat, crew: renderCrew, team: renderTeam })[S.tab](m);
}
function show(fn) { S.view = () => fn($('#main')); render(); scrollTo(0, 0); }

/* ---------- event helpers ---------- */
const upcoming = () => S.events.filter(e => (e.end_date || e.event_date) >= todayISO() && e.status !== 'proposed');
const isShort = e => e.min_busters != null && e.going < e.min_busters;
const placesFor = eid => S.eplaces.filter(x => x.event_id === eid).map(x => ({ ...x, place: S.places.find(p => p.id === x.place_id) })).filter(x => x.place);
function mapsUrl(pl) {
  const app = S.profile.maps_app || 'google';

/* ---------- Events ---------- */
const FILTERS = [['upcoming', 'Upcoming'], ['waiting', 'Waiting on you'], ['mine', 'Mine'], ['need', 'Need Busters'], ['charity', 'Hospital & charity'], ['incomplete', 'Details coming'], ['past', 'Past']];
function filtered() {
  const q = S.evSearch.toLowerCase(); const t = todayISO();
  let list = S.events.filter(e => e.status !== 'proposed');
  switch (S.evFilter) {
    case 'past': list = list.filter(e => (e.end_date || e.event_date) < t).reverse(); break;
    case 'waiting': list = list.filter(isWaiting); break;
    case 'mine': list = list.filter(e => (e.end_date || e.event_date) >= t && ['going', 'maybe'].includes((myRsvp(e.id) || {}).answer)); break;
    case 'need': list = list.filter(e => (e.end_date || e.event_date) >= t && e.status === 'scheduled' && (isShort(e) || (e.goal_busters && e.going < e.goal_busters))); break;
    case 'charity': list = list.filter(e => (e.end_date || e.event_date) >= t && ['Hospital', 'Charity'].includes(e.category)); break;
    case 'incomplete': list = list.filter(e => (e.end_date || e.event_date) >= t && e.status === 'scheduled' && e.missing.length); break;
    default: list = list.filter(e => (e.end_date || e.event_date) >= t);
  }
  if (q) list = list.filter(e => (e.title + ' ' + (e.category || '') + ' ' + placesFor(e.id).map(p => p.place.name + ' ' + (p.place.address || '')).join(' ')).toLowerCase().includes(q));
  return list;
}

function renderCal(box) {
  const base = S.calMonth || todayISO().slice(0, 7);
  const [y, mo] = base.split('-').map(Number);
  const firstDay = new Date(y, mo - 1, 1); const start = new Date(firstDay); start.setDate(1 - firstDay.getDay());
  const t = todayISO(); const q = S.evSearch.toLowerCase();
  const evs = S.events.filter(e => e.status !== 'proposed' && (!q || e.title.toLowerCase().includes(q)));
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  let cells = ''; const d = new Date(start);

/* ---------- Event editor ---------- */
function editEvent(e, propose = false) {
  const isNew = !e; e = e || { title: '', event_date: todayISO() };
  const pocs = S.people.filter(p => ['active', 'rookie'].includes(p.status) && (p.abilities.includes('poc') || p.abilities.includes('crew_admin')));
  let pls = isNew ? [{ label: 'Event', name: '', address: '' }] : placesFor(e.id).map(x => ({ place_id: x.place_id, label: x.label, name: x.place.name, address: x.place.address || '' }));
  if (!pls.length) pls = [{ label: 'Event', name: '', address: '' }];

  const t = k => e[k] ? e[k].slice(0, 5) : '';
  show(m => {
    m.innerHTML = `<button class="back" id="bk">${ICON.back} ${isNew ? 'Events' : 'Back to brief'}</button>
      <h2 style="font-size:30px">${propose ? 'Suggest an event' : isNew ? 'New event' : 'Edit event'}</h2>
      <p class="muted small">${propose ? 'The events team sees your suggestion and decides whether to take it on.' : 'Save with just a name and date if that is all you have. The event shows as Details coming until the point of contact, event contact, address, times, minimum and goal are in.'}</p>

        <label class="f"><span>Event name</span><input class="in" name="title" required value="${v('title')}"></label>
        <div class="grid2"><label class="f"><span>Date</span><input class="in" type="date" name="event_date" required value="${v('event_date')}"></label><label class="f"><span>Ends (multi-day only)</span><input class="in" type="date" name="end_date" value="${v('end_date')}"></label></div>
        <label class="f"><span>Category</span><select class="in" name="category"><option value="">Choose</option>${CATEGORIES.map(c => `<option ${e.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
        <div class="grid3"><label class="f"><span>Call</span><input class="in" type="time" name="call_time" value="${t('call_time')}"></label><label class="f"><span>Start</span><input class="in" type="time" name="start_time" value="${t('start_time')}"></label><label class="f"><span>Wrap</span><input class="in" type="time" name="wrap_time" value="${t('wrap_time')}"></label></div>
        <h3 style="margin-top:20px">Places</h3><p class="muted small" style="margin:2px 0 0">Each place gets its own Navigate button. Pick a saved place or type a new one; new ones are saved for next time.</p>
        <div id="pls"></div><button type="button" class="btn sm" id="addpl" style="margin-top:8px">+ Add a place</button>
        <datalist id="saved">${S.places.filter(p => !p.retired_at).map(p => `<option value="${esc(p.name)}">`).join('')}</datalist><datalist id="savedaddr">${[...new Map(S.places.filter(p => !p.retired_at && p.address).map(p => [p.address, p])).values()].map(p => `<option value="${esc(p.address)}">${esc(p.name)}</option>`).join('')}</datalist>
        ${propose ? '' : `<h3 style="margin-top:20px">People</h3>
        <label class="f"><span>Point of contact</span><select class="in" name="poc_id"><option value="">Choose</option>${pocs.map(p => `<option value="${p.id}" ${e.poc_id === p.id ? 'selected' : ''}>${esc(nameOf(p))}</option>`).join('')}</select></label>
        <div class="grid3"><label class="f"><span>Minimum</span><input class="in" type="number" min="0" name="min_busters" value="${v('min_busters')}"></label><label class="f"><span>Goal</span><input class="in" type="number" min="0" name="goal_busters" value="${v('goal_busters')}"></label><label class="f"><span>Maximum</span><input class="in" type="number" min="0" name="max_busters" value="${v('max_busters')}" placeholder="Only if limited"></label></div>`}
        <h3 style="margin-top:20px">Event contact</h3>
        <label class="f"><span>Name</span><input class="in" name="contact_name" value="${v('contact_name')}"></label>
        <div class="grid2"><label class="f"><span>Phone</span><input class="in" type="tel" name="contact_phone" value="${v('contact_phone')}"></label><label class="f"><span>Email</span><input class="in" type="email" name="contact_email" value="${v('contact_email')}"></label></div>
        <h3 style="margin-top:20px">Details</h3>
        <label class="f"><span>Schedule</span><textarea class="in" name="schedule">${v('schedule')}</textarea></label>
        <label class="f"><span>Driving and parking</span><textarea class="in" name="parking">${v('parking')}</textarea></label>
        <label class="f"><span>Conditions (indoors, weather, uniform)</span><input class="in" name="conditions" value="${v('conditions')}"></label>
        <label class="f"><span>Notes</span><textarea class="in" name="notes" style="min-height:140px">${v('notes')}</textarea></label>
        <div class="btns" style="margin:20px 0 10px"><button class="btn primary">${propose ? 'Send suggestion' : 'Save event'}</button><button type="button" class="btn ghost" id="cx">Cancel</button>${!isNew && can('edit_events') ? '<button type="button" class="btn danger" id="del" style="margin-left:auto">Delete</button>' : ''}</div>
      </form><div style="height:40px"></div>`;

      $('#pls').innerHTML = pls.map((p, i) => `<div class="card" style="margin-top:8px"><div class="grid2">
        <label class="f" style="margin:0"><span>Label</span><input class="in" data-i="${i}" data-k="label" list="labels" value="${esc(p.label)}"></label>
        <label class="f" style="margin:0"><span>Place name</span><input class="in" data-i="${i}" data-k="name" list="saved" value="${esc(p.name)}"></label></div>
        <label class="f"><span>Address</span><input class="in" data-i="${i}" data-k="address" list="savedaddr" autocomplete="off" placeholder="Start typing; known addresses pop up" value="${esc(p.address)}"></label>
        <button type="button" class="btn sm ghost" data-rm="${i}" style="margin-top:8px">Remove</button></div>`).join('') + '<datalist id="labels"><option value="Event"><option value="Parking"><option value="Staging"><option value="Meeting point"><option value="Dinner spot"></datalist>';

        const p = pls[inp.dataset.i]; p[inp.dataset.k] = inp.value;
        if (inp.dataset.k === 'name') {
          const hit = S.places.find(x => !x.retired_at && x.name === inp.value);
          if (hit) { p.place_id = hit.id; p.address = hit.address || ''; if (!p.label || p.label === 'Event') p.label = hit.kind || p.label; drawPls(); } else delete p.place_id;
        }
        if (inp.dataset.k === 'address') {
          const hit = S.places.find(x => !x.retired_at && x.address && x.address === inp.value);
          if (hit) { p.place_id = hit.id; if (!p.name) p.name = hit.name; drawPls(); } else delete p.place_id;
        }
      });
      $('#pls').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { pls.splice(+b.dataset.rm, 1); drawPls(); });
    };
    drawPls();
    $('#addpl').onclick = () => { pls.push({ label: 'Parking', name: '', address: '' }); drawPls(); };
    const leave = () => isNew ? (S.view = null, render()) : openEvent(e.id);

    const del = $('#del'); if (del) del.onclick = async () => { if (!confirmBox('Delete this event for good? Use Cancel instead if it was called off.')) return; await rpc('delete_event', { p_event: e.id }); await refresh(); S.view = null; S.tab = 'home'; render(); toast('Deleted'); };
    $('#ef').onsubmit = async ev => {
      ev.preventDefault();
      const fd = new FormData(ev.target); const p = {};
      for (const [k, val] of fd.entries()) p[k] = String(val).trim();
      if (!isNew) p.id = e.id;
      if (propose) p.status = 'proposed';
      ev.target.querySelector('button.primary').disabled = true;
      try {
        const id = await rpc('save_event', { p_crew: S.crew.id, p });
        if (!propose || pls.some(x => x.name || x.address)) await rpc('set_event_places', { p_event: id, p_places: pls.filter(x => x.name || x.address || x.place_id) });
        await refresh();
        if (propose) { S.view = null; render(); toast('Thanks! The events team will take a look.'); }
        else { openEvent(id); toast('Saved'); }
      } catch (err) { ev.target.querySelector('button.primary').disabled = false; }
    };
  });
}

let crewQ = '';
/* ---------- member map ---------- */
let leafletP = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletP) return leafletP;
  leafletP = new Promise((ok, bad) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'; js.onload = ok; js.onerror = bad; document.head.appendChild(js);
  });
  return leafletP;
}
async function drawMemberMap() {
  const el = $('#mmap'); if (!el) return;
  let pts = [];
  try { await loadLeaflet(); pts = (await rpc('member_map', { p_crew: S.crew.id })) || []; } catch (e) { $('#mmcount').textContent = 'The map could not load right now.'; return; }
  if (!$('#mmap')) return;
  const total = S.people.filter(p => ['active', 'rookie'].includes(p.status)).length;
  $('#mmcount').textContent = pts.length ? `${pts.length} of ${total} members on the map, by city` : 'Nobody on the map yet. Add your city to be the first.';
  const map = L.map(el, { zoomControl: true, attributionControl: true, scrollWheelZoom: false }).setView([34.05, -118.25], 9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 14, className: 'mtiles', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
  const byCity = {};
  pts.forEach(x => { const k = x.lat + ',' + x.lng; (byCity[k] = byCity[k] || { lat: x.lat, lng: x.lng, city: x.city, ids: [] }).ids.push(x.person_id); });
  const groups = Object.values(byCity);
  groups.forEach(g => {
    const n = g.ids.length;
    const icon = L.divIcon({ className: '', html: `<div class="mpin${g.ids.includes(S.me && S.me.id) ? ' me' : ''}">${n}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
    const names = g.ids.map(id => personById(id)).filter(Boolean).map(p => `<a href="#" data-person="${p.id}">${esc(p.callsign || p.full_name)}</a>`).join('<br>');
    L.marker([g.lat, g.lng], { icon }).addTo(map).bindPopup(`<div class="mpop"><b>${esc(g.city)}</b><div>${names}</div></div>`);
  });
  if (groups.length > 1) map.fitBounds(groups.map(g => [g.lat, g.lng]), { padding: [30, 30], maxZoom: 11 });
  else if (groups.length === 1) map.setView([groups[0].lat, groups[0].lng], 10);
  map.on('popupopen', e => e.popup.getElement().querySelectorAll('[data-person]').forEach(a => a.onclick = ev => { ev.preventDefault(); openPerson(a.dataset.person); }));
}

function adoptionCard() {

async function discordCheck() {

async function readQrPicture(file) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) { toast("That picture couldn't be opened."); return null; }
  const draw = max => { const k = Math.min(1, max / Math.max(bmp.width, bmp.height)); const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); const x = c.getContext('2d'); x.drawImage(bmp, 0, 0, c.width, c.height); return c; };
  try {
    await loadScript(QR_READ);
    const c = draw(1200), px = c.getContext('2d').getImageData(0, 0, c.width, c.height);
    const hit = jsQR(px.data, c.width, c.height);
    if (hit && /^https:\/\//i.test(hit.data)) return { url: hit.data };
  } catch (e) { /* fall back to the picture */ }
  let img = draw(500).toDataURL('image/png'); if (img.length > 290000) img = draw(500).toDataURL('image/jpeg', .85);
  return { img };
}

/* ---------- alerts ---------- */
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const b64url = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushSub() { if (!pushOK()) return null; const reg = await navigator.serviceWorker.getRegistration(); return reg ? reg.pushManager.getSubscription() : null; }
async function alertsOn() {
  const key = await rpc('push_public_key');
  if (!key) { toast('Alerts are not set up yet. Try again in a few minutes.'); return false; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifications are blocked. Allow them for Busters in your phone or browser settings.'); return false; }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64url(key) });
  const j = sub.toJSON();
  const { error } = await sb.from('push_subs').upsert({ user_id: S.session.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
  if (error) { toast(error.message); return false; }
  return true;
}
async function alertsOff() {
  const sub = await pushSub(); if (!sub) return;
  await sb.from('push_subs').delete().eq('endpoint', sub.endpoint);
  try { await sub.unsubscribe(); } catch (e) {}
}

  sheet(`<h3>Alerts</h3>

    ${device}
    <label class="check" style="margin-top:12px"><input type="checkbox" id="al-short" ${short ? 'checked' : ''}><span><b>Short-staffed events</b><div class="small muted">When an event is below its minimum</div></span></label>
    <div id="al-dayswrap" style="padding:0 0 6px 30px;${short ? '' : 'opacity:.4;pointer-events:none'}">
      <div class="small" style="margin-bottom:6px">Warn me up to <b id="al-daysv">${days}</b> day${days === 1 ? '' : 's'} ahead</div>
      <input type="range" id="al-days" min="1" max="14" step="1" value="${Math.min(days, 14)}" style="width:100%;accent-color:var(--cyan)">
      <div class="tiny dim" style="display:flex;justify-content:space-between"><span>1 day</span><span>2 weeks</span></div>
    </div>
    <label class="check"><input type="checkbox" id="al-last" ${last ? 'checked' : ''}><span><b>48-hour last call</b><div class="small muted">Two days out, if it still needs Busters</div></span></label>
    <p class="tiny dim">You only get these for events you haven't said Going or No to. Each event alerts you once per kind.</p>
    <div class="btns" style="margin-top:12px">${on ? '<button class="btn sm" id="al-test">Send a test alert</button>' : ''}<button class="btn sm ghost" data-close>Done</button></div>`, s => {
    const save = async () => {
      const p = { p_short: $('#al-short', s).checked, p_days: parseInt($('#al-days', s).value), p_lastcall: $('#al-last', s).checked };
      await rpc('set_alert_prefs', p);
      S.profile = Object.assign(S.profile || {}, { alert_short: p.p_short, alert_days: p.p_days, alert_lastcall: p.p_lastcall });
    };
    $('#al-short', s).onchange = () => { const w = $('#al-dayswrap', s); w.style.opacity = $('#al-short', s).checked ? '' : '.4'; w.style.pointerEvents = $('#al-short', s).checked ? '' : 'none'; save().then(() => toast('Saved')); };
    $('#al-last', s).onchange = () => save().then(() => toast('Saved'));
    const r = $('#al-days', s);
    r.oninput = () => { const v = parseInt(r.value); $('#al-daysv', s).textContent = v; $('#al-daysv', s).nextSibling.textContent = v === 1 ? ' day ahead' : ' days ahead'; };
    r.onchange = () => save().then(() => toast('Saved'));
    const dev = $('#al-dev', s); if (dev) dev.onclick = async () => {
      dev.disabled = true;
      try { if (on) { await alertsOff(); toast('Alerts off on this device'); } else if (await alertsOn()) toast('Alerts on'); } catch (e) { toast('Could not change alerts: ' + e.message); }
      closeSheet(); openAlerts();
    };
    const t = $('#al-test', s); if (t) t.onclick = async () => {
      t.disabled = true;
      try {
        const { data } = await sb.auth.getSession();
        const res = await fetch(SB_URL + '/functions/v1/busters-alerts', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + data.session.access_token }, body: '{"mode":"test"}' });
        const j = await res.json();
        toast(j.sent ? 'Test alert sent' : (j.note || j.error || 'No alert sent'));
      } catch (e) { toast('Test failed: ' + e.message); }
      t.disabled = false;
    };
  });
}
function openMenu() {
  sheet(`<div class="menu-r"><img src="img/emblem.png" alt="" style="width:70px;margin:0 auto 8px">
    <a class="menuitem" href="${DONATE_URL}" target="_blank" rel="noopener"><span class="grow">Give Back: donate to Starlight</span><span class="muted">↗</span></a>
    <a class="menuitem" href="https://forms.wix.com/r/7168473352057652079" target="_blank" rel="noopener"><span class="grow">Event request form</span><span class="muted">↗</span></a>
    <a class="menuitem" href="https://forms.wix.com/r/6936122162306613874" target="_blank" rel="noopener"><span class="grow">Recruit form</span><span class="muted">↗</span></a>
    <a class="menuitem" href="https://www.losangelesgb.com/" target="_blank" rel="noopener"><span class="grow">About LAGB</span><span class="muted">↗</span></a>
    <a class="menuitem" id="pp"><span class="grow">Proton pack monitor<div class="small muted">In-world pack diagnostics, assigned to a Buster</div></span><span class="muted">›</span></a>
    <a class="menuitem" id="how"><span class="grow">How to use Busters</span><span class="muted">›</span></a>
    <a class="menuitem" href="mailto:deftspyder@gmail.com?subject=Busters%20feedback"><span class="grow">Send feedback</span><span class="muted">↗</span></a>
    ${can('crew_admin') ? `<div class="small muted" style="margin:14px 0 4px;text-transform:uppercase;letter-spacing:.08em">Admin</div>
      <a class="menuitem" id="adm-ann"><span class="grow">Post an announcement</span><span class="muted">›</span></a>
      <a class="menuitem" id="adm-log"><span class="grow">Action log</span><span class="muted">›</span></a>` : ''}
    <p class="tiny dim" style="margin-top:14px">Busters beta for ${esc(S.crew.short)}. Ghostbusters and the No-Ghost logo are trademarks of Columbia Pictures.</p></div>`, s => {
    s.parentNode.classList.add('right');
    $('#pp', s).onclick = () => { closeSheet(); openPack(); };
    $('#how', s).onclick = () => sheet(`<h3>How to use Busters</h3>
      <p><b>Home</b> shows what needs you now: your next event, anything you haven't answered, and announcements.</p>
      <p><b>Home</b> lists every event coming up. Tap one to open it, then answer right there or open its full brief, then answer Going, Maybe or No, with your ride and a note.</p>
      <p><b>Navigate</b> buttons open your maps app. Pick Google Maps, Apple Maps or Waze from your profile picture.</p>
      <p><b>Alerts</b>: turn them on from your profile picture to hear when an event is short on Busters.</p>
      <p><b>My Busters</b> is your own record and your contact details. Tap your initials at the top to open it.</p>
      <p><b>Add to your home screen</b> so Busters opens like an app: on iPhone tap Share then "Add to Home Screen"; on Android tap the ⋮ menu then "Install app".</p>
      <button class="btn" data-close>Got it</button>`);
    const a1 = $('#adm-ann', s); if (a1) a1.onclick = postAnnouncement;
    const a2 = $('#adm-log', s); if (a2) a2.onclick = () => { closeSheet(); show(renderLog); };
  });
}

/* ---------- sheets ---------- */
let onSheetClose = null;
function sheet(html, wire, onClose) {
  onSheetClose = onClose || null;
  $('#layer').innerHTML = `<div class="scrim"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`;
  const s = $('#layer .sheet');
  $('#layer .scrim').onclick = e => { if (e.target.classList.contains('scrim')) closeSheet(); };
  s.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  if (wire) wire(s);
}
function closeSheet() { $('#layer').innerHTML = ''; const f = onSheetClose; onSheetClose = null; if (f) f(); }
const confirmBox = msg => window.confirm(msg);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
})();
</script>
