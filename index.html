<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Busters</title>
<meta name="description" content="Events, sign-ups and crew tools for the Los Angeles Ghostbusters.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<link rel="icon" href="icons/favicon-64.png?v=4" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Busters">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:#0d0f14;--panel2:#151922;--line:#232a36;--ink:#f3f5f8;--muted:#9aa4b2;--dim:#6b7584;
  --cyan:#35b2e8;--cyan-soft:rgba(53,178,232,.14);--coral:#ff8c78;--pink:#ff5e86;--purple:#9b6fb0;--teal:#3ba7c0;--cream:#f7e3a0;
  --hazard:#ffd400;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;
  --sunset:linear-gradient(90deg,var(--coral),var(--pink) 35%,var(--purple) 70%,var(--teal));
  --r:14px;--pad:16px;--tabh:64px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.04em;margin:0}
h2{font-size:26px}h3{font-size:20px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.tiny{font-size:12px}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.top .bar{display:flex;align-items:center;gap:12px;height:56px;max-width:760px;margin:0 auto;padding:0 var(--pad)}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;background:none;border:0;padding:0;cursor:pointer}
.top .bmk{width:32px;height:32px;border-radius:8px;flex:0 0 auto;display:block;box-shadow:0 0 0 1px rgba(53,178,232,.45),0 0 10px rgba(53,178,232,.35)}
.top .iconbtn,.top .avatar{flex:0 0 auto}
.top .bdiv{width:1px;height:24px;background:var(--line);flex:0 0 auto}
.top .logo{display:block;width:156px;max-width:100%;height:auto;min-width:0}
@media (max-width:400px){.top .bar{gap:8px}.top .brand{gap:7px}.top .bmk{width:28px;height:28px;border-radius:7px}}
.top .sp{flex:1}
.hz{height:10px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#111 10px 20px)}
.iconbtn.cyc{overflow:hidden;padding:0}.iconbtn.cyc svg{width:100%;height:100%;display:block}
.iconbtn.cyc .cbody{fill:#7b8089;stroke:#555a62;stroke-width:.6}
.iconbtn.cyc circle[class^="cl"]{fill:#3a3d42;stroke:#26282c;stroke-width:.7;animation:4s step-end infinite}
.iconbtn.cyc circle.cl1[class]{animation-name:cyA}.iconbtn.cyc circle.cl2[class]{animation-name:cyB}.iconbtn.cyc circle.cl3[class]{animation-name:cyC}.iconbtn.cyc circle.cl4[class]{animation-name:cyD}
@keyframes cyA{0%{fill:#ff4a3a;stroke:#ffb3a8}25%{fill:#3a3d42;stroke:#26282c}}
@keyframes cyB{0%{fill:#3a3d42;stroke:#26282c}25%{fill:#ff4a3a;stroke:#ffb3a8}50%{fill:#3a3d42;stroke:#26282c}}
@keyframes cyC{0%{fill:#3a3d42;stroke:#26282c}50%{fill:#ff4a3a;stroke:#ffb3a8}75%{fill:#3a3d42;stroke:#26282c}}
@keyframes cyD{0%{fill:#3a3d42;stroke:#26282c}75%{fill:#ff4a3a;stroke:#ffb3a8}}
@media (prefers-reduced-motion:reduce){.iconbtn.cyc circle[class^="cl"]{animation:none;fill:#ff3b2f}}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sunset);color:#000;font-weight:700;display:grid;place-items:center;font-size:14px;border:0;cursor:pointer}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#08090c;padding-bottom:env(safe-area-inset-bottom)}
.tabs .tabs-in{display:flex;max-width:760px;margin:0 auto;padding:0 8px}
.tab{flex:1;height:var(--tabh);border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:#bfeaff;text-shadow:0 0 4px var(--cyan),0 0 10px var(--cyan),0 0 18px rgba(53,178,232,.6);background:radial-gradient(ellipse 60% 70% at 50% 55%,rgba(53,178,232,.16),transparent 75%)}
.tab::after{content:"";position:absolute;inset:6px 0 6px;border:1px solid var(--line);border-left:0;border-bottom:0;pointer-events:none;transition:border-color .15s,box-shadow .15s}
.tab:first-child::after{border-left:1px solid var(--line);border-top-left-radius:14px}
.tab:last-child::after{border-top-right-radius:14px}
.tab.on:first-child::after{left:0}
.tab.on::after{left:-1px;z-index:1;border-left:1px solid;border-color:rgba(255,190,120,.9);box-shadow:0 0 6px #ff9a3c,0 0 14px rgba(255,140,50,.55),inset 0 8px 10px -6px rgba(255,140,50,.5);clip-path:inset(-24px -24px 0 -24px)}
.tab.on svg{filter:drop-shadow(0 0 3px var(--cyan)) drop-shadow(0 0 8px rgba(53,178,232,.7))}
.chip .badge{background:var(--pink);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;padding:0 4px;place-items:center;font-weight:700}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--pink);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;font-weight:700}

/* cards and rows */
.sec{margin:20px 0}
.sec>h2{margin:0 0 10px;display:flex;align-items:center;gap:10px}
.sec>h2 .act{margin-left:auto;font-family:"DM Sans",system-ui,sans-serif;font-size:14px;letter-spacing:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-decoration:none;color:inherit}
.row+.row{margin-top:8px}
.row:hover{border-color:#33404f}
.row .grow{flex:1;min-width:0}
.xrow+.xrow{margin-top:8px}
.xrow .row .grow{flex:1;min-width:0}
.xrow .row.xh{align-items:flex-start}
.xrow .row.xh .xside{flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px}
.xrow .row.xh .xside .chev{margin-top:auto}
.xrow .row.xh .xside .chev:only-child{margin:auto 0}
.xrow .row.xh .pills{flex-wrap:nowrap;overflow:hidden}
.xrow .row.xh .pills .pill{display:inline-block;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.xrow .chev{flex:0 0 auto;color:var(--dim);transform:rotate(-90deg);transition:transform .15s;display:grid}
.xedit{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.xedit:hover{color:var(--cyan);border-color:var(--cyan)}
.xrow.open .chev{transform:rotate(90deg)}
.xrow.open .row{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.xrow.waiting .row{border-color:rgba(248,113,113,.45)}
.xb{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:0 12px 12px}
.xrow.waiting .xb{border-color:rgba(248,113,113,.45)}
.xl{display:flex;align-items:center;gap:10px;padding-top:4px}
.xpl{padding-top:2px}
.xp{display:flex;align-items:center;gap:10px;padding:8px 0}
.xp+.xp{border-top:1px solid var(--line)}
.xl .tl{font-size:14px}
.xb .choices{margin-top:10px}
.xb .xfull{margin-top:10px;width:100%}
.wait{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px 2px 7px;font-size:12px;font-weight:700;color:#fff;background:rgba(248,113,113,.18);border:1px solid var(--bad);animation:waitglow 1.6s ease-in-out infinite}
.wait i{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
@keyframes waitglow{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.0)}50%{box-shadow:0 0 10px 2px rgba(248,113,113,.55)}}
.tab .badge.pulse{background:var(--bad);animation:waitglow 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.wait,.tab .badge.pulse{animation:none}}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox{width:52px;flex:0 0 52px;text-align:center;border-radius:10px;background:var(--panel2);padding:6px 0;line-height:1}
.datebox .m{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.08em}
.datebox .d{font-family:"Bebas Neue";font-size:28px}
.datebox .w{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.pill.good{color:var(--good);border-color:rgba(74,222,128,.35)}
.pill.warn{color:var(--warn);border-color:rgba(251,191,36,.35)}
.pill.bad{color:var(--bad);border-color:rgba(248,113,113,.35)}
.pill.cyan{color:var(--cyan);border-color:rgba(53,178,232,.4)}
.pill.cream{color:var(--cream);border-color:rgba(247,227,160,.35)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qa{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.qa .qal{font-size:12px;font-weight:700;color:var(--muted)}
.qa.hot .qal{color:#f87171}
.qa .qb{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font:700 16px "DM Sans",sans-serif;cursor:pointer;padding:0;display:grid;place-items:center}
.qa .qb.y{border-color:var(--good);color:var(--good)}.qa .qb.m{border-color:var(--warn);color:var(--warn)}.qa .qb.n{color:var(--muted)}
.qa .qb:active{transform:scale(.94)}
.qa .qsp{flex:1}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* buttons and forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#001018}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:rgba(248,113,113,.4);background:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.sheetacts{justify-content:flex-end}.sheetacts [data-close].ghost{order:-1}.sheetacts .danger{order:0}.sheetacts .primary{order:1}
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.in,select.in,textarea.in{width:100%;background:#07080b;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.in:focus{border-color:var(--cyan)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid2>*,.grid3>*{min-width:0}
input.in{min-width:0}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:#000}
.seg.rsvp button.on.going{background:var(--good);color:#001a08}
.seg.rsvp button.on.maybe{background:var(--warn);color:#1a1200}
.seg.rsvp button.on.no{background:#3a4352;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.sched-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.in.sm,select.in.sm{width:auto;display:inline-block;padding:4px 8px;margin:2px 0}
.sched-row .chips{flex-wrap:wrap}
.sechd{display:flex;align-items:center;justify-content:space-between;gap:10px}.sechd h2{margin:0}
.schedup{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.schedup:first-child{border-top:0}
.schedup .swhen{flex:0 0 7.5em;color:var(--cyan);font-weight:700;font-size:13px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.check input{width:20px;height:20px;flex:0 0 20px;margin:0;accent-color:var(--cyan)}

/* home */
.hello{display:flex;align-items:center;gap:8px}
.gbpill{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-size:12px;white-space:nowrap}
.gbpill .ic{color:#f87171}
.mmap{height:300px;background:#0d0f14;position:relative;z-index:0;isolation:isolate}
.gmap{display:block;width:100%;height:380px;border:0}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.pstats div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.pstats b{display:block;font-family:"Bebas Neue";font-size:26px;font-weight:400;line-height:1}
.pstats span{font-size:11px;color:var(--muted)}
.prow2{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.prow2 span{color:var(--cyan);min-width:52px}
.pab{border-top:1px solid var(--line);padding-top:12px}
.crewgrid .row::after{content:"\203A";color:var(--dim);margin-left:auto;font-size:18px;padding-left:4px}
.crewgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.crewgrid .row{margin:0;min-width:0}
.crewgrid .row .grow{min-width:0}
.crewgrid .row .t,.crewgrid .row .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.crewgrid{grid-template-columns:1fr}}
.mtiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.mpin{width:30px;height:30px;border-radius:50%;background:var(--cyan);color:#001018;font:700 13px "DM Sans",sans-serif;display:grid;place-items:center;border:2px solid #001018;box-shadow:0 0 0 4px rgba(56,217,232,.25)}
.mpin.me{background:var(--good);box-shadow:0 0 0 4px rgba(74,222,128,.3)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.mpop a{color:var(--cyan)}.mpop b{display:block;margin-bottom:4px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#8a94a6!important}.leaflet-control-attribution a{color:#8a94a6!important}
.lbrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lbrow .rk{width:22px;text-align:center;color:var(--muted);font-weight:700}
.lbrow.me{background:rgba(56,217,232,.08);border-radius:10px}
.mehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mehead h2{margin-right:4px}
.stats{padding:4px 14px}
.stat{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.stat:last-child{border-bottom:0}
.stat .grow{flex:1;min-width:0}.stat .ch{width:10px;flex:0 0 auto;text-align:right}
.stat .sv{font-family:"Bebas Neue",Impact,sans-serif;font-size:26px;line-height:1;letter-spacing:.03em}
.stat.go{cursor:pointer}.stat.go:active{opacity:.7}
.stat .pips{display:inline-flex;gap:3px;margin-right:7px;vertical-align:1px}
.stat .pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid #3a4352;box-sizing:border-box}
.stat .pips i.r{border-color:var(--cyan)}
.stat .pips i.f{background:var(--warn);border-color:var(--warn)}
.stats.met .pips i.f{background:var(--good);border-color:var(--good)}
.mystripe{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:flex-end}
.mystripe.me{justify-content:flex-start;margin-top:14px}
.mystripe .gbpill{margin-left:0;height:32px;padding:0 12px;font-size:13px}
.mypill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;font-size:13px;white-space:nowrap}
.mypill b{font-weight:700}
.mypill .pips{display:inline-flex;gap:3px}
.mypill .pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid #3a4352;box-sizing:border-box}
.mypill .pips i.r{border-color:var(--cyan)}
.mypill .pips i.f{background:var(--warn);border-color:var(--warn)}
.mypill.met{border-color:rgba(74,222,128,.45)}
.mypill.met .pips i.f{background:var(--good);border-color:var(--good)}
.next{border:1px solid rgba(53,178,232,.35);background:linear-gradient(180deg,rgba(53,178,232,.10),rgba(53,178,232,0) 60%),var(--panel)}
.pke{display:flex;gap:10px;margin:12px 0}
.pke div{flex:1;background:#07080b;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.pke b{display:block;font-family:"Bebas Neue";font-size:30px;color:var(--cyan);line-height:1}
.pke span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.script{font-family:Yellowtail,cursive;color:var(--cream);font-size:22px}

/* brief */
.gc-title{display:flex;gap:14px;align-items:flex-start;margin:6px 0 6px}
.gc-sq{flex:0 0 auto;width:16px;height:16px;border-radius:4px;margin-top:8px}
.gc-when{font-size:15px;margin-top:4px}
.gc-place{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:8px}
.gc-place .gc-ic{width:16px;height:16px;flex:0 0 16px;color:var(--muted);align-self:flex-start;margin-top:2px}
.gc-sub{font-size:13px;color:var(--muted);margin-top:2px}
.gc-row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.gc-row .gc-ic{flex:0 0 auto;color:var(--muted);margin:1px 0 0 -2px}
.gc-row .navic{margin:-4px 0}
.gc-body{flex:1;min-width:0}
.gc-lbl{font-size:12px;color:var(--muted)}
.gc-names{font-size:14px;line-height:1.6;margin-top:2px}
.ct{display:flex;align-items:center;gap:10px}
.ct-who{flex:1;min-width:0}
.ct-name{background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.ct-num{color:var(--muted);margin-top:3px}
.ct-num a{color:var(--cyan)}
.ct-btns{display:flex;gap:8px;flex:0 0 auto}

/* ---------- boot and sign-in ---------- */
async function boot() {
  // A sign-in link that didn't work comes back with an error in the address; say so instead of silently showing the sign-in page.
  const bad = new URLSearchParams(location.hash.slice(1)).get('error_code') || new URLSearchParams(location.search).get('error_code');
  if (bad) { history.replaceState(null, '', location.pathname); setTimeout(() => toast(bad === 'otp_expired' ? 'That sign-in link expired or was already used. Only the newest email works, so send a new one.' : 'That sign-in link didn\'t work. Send a new one.'), 300); }
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  sb.auth.onAuthStateChange((ev, session) => {
    const had = !!S.session; S.session = session;
    if (ev === 'SIGNED_IN' && !had) enter();
    if (ev === 'SIGNED_OUT') renderGate();
  });
  if (!S.session) return renderGate();
  enter();
}

// Busters' own brand mark (the app, not any one crew): the name in Bebas with caution stripes under it.
const BRAND = `<div class="bmark" role="img" aria-label="Busters"><div class="bmark-name">BUSTERS</div><div class="bmark-hz"></div><div class="bmark-tag">Crew app for Ghostbusters franchises</div></div>`;
function renderGate(step = 'email', email = '') {
  $('#layer').innerHTML = '';
  $('#app').innerHTML = `<div class="gate">
    ${BRAND}
    <div class="card">
      ${step === 'email' ? `
        <h2>Sign in to Busters</h2>
        <p class="muted small">Use the email the crew has for you. We'll send a sign-in link and a sign-in code.</p>
        <form id="f"><label class="f"><span>Email</span><input class="in" type="email" name="email" required autocomplete="email" value="${esc(email)}"></label>
        <button class="btn primary block" style="margin-top:14px">Send my link</button></form>` : `
        <h2>Check your email</h2>
        <p class="muted small">We sent a link to <b>${esc(email)}</b>. Tap it on this device, or type the code from the email here.</p>
        <form id="f"><label class="f"><span>Sign-in code</span><input class="in" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="\\d{6,10}" required></label>
        <button class="btn primary block" style="margin-top:14px">Sign in</button></form>
        <button class="btn ghost block" id="again" style="margin-top:8px">Use a different email</button>`}
    </div>
    <p class="dim tiny" style="text-align:center;margin-top:18px">Busters is for members of official Ghostbusters franchise crews. New here? Sign in and a crew admin will approve you.</p>
  </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true;
    if (step === 'email') {
      const em = e.target.email.value.trim().toLowerCase();
      const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + location.pathname + location.search } });
      if (error) { toast(error.message); btn.disabled = false; return; }
      renderGate('code', em);
    } else {
      const { error } = await sb.auth.verifyOtp({ email, token: e.target.code.value.replace(/\D/g, ""), type: 'email' });
      if (error) { toast('That code did not work. Try again or use the link.'); btn.disabled = false; }
    }
  };
  const again = $('#again'); if (again) again.onclick = () => renderGate('email', email);
}

async function enter(name) {
  $('#app').innerHTML = '<div class="gate"><p class="muted" style="text-align:center">Loading...</p></div>';
  let res;
  try { res = await rpc('enter_crew', { p_slug: CREW_SLUG, p_name: name || null }); } catch (e) { return renderGate(); }
  if (res.status === 'need_name') return renderNeedName();
  if (res.status === 'pending') return renderWaiting(res.crew);
  if (res.status === 'declined' || res.status === 'removed' || res.status === 'retired') return renderBlocked(res.status);
  S.crew = { id: res.crew_id, short: res.crew };
  await loadAll();
  if (!S.me) return renderBlocked('removed');
  const dbx = new URLSearchParams(location.search).get('dropbox');
  const startHash = dbx ? '' : location.hash;
  if (dbx) { S.tab = 'team'; S.adminTab = 'app'; history.replaceState(null, '', location.pathname); }
  S.popping = true; try { renderShell(); } finally { S.popping = false; }
  chatRefresh(true);
  if (dbx) toast({ connected: 'Dropbox connected. Photo calls start the morning after each event.', cancelled: 'Dropbox connection cancelled', expired: 'That link expired. Tap Connect Dropbox again.' }[dbx] || 'Dropbox could not connect. Try again.');
  if (startHash) { S.popping = true; try { applyRoute(startHash); } finally { S.popping = false; } }
}

function renderNeedName() {
  $('#app').innerHTML = `<div class="gate">${BRAND}
    <div class="card"><h2>Ask to join</h2>
    <p class="muted small">We don't have this email on the crew list yet. Tell us your name and a crew admin will approve you.</p>
    <form id="f"><label class="f"><span>Your full name</span><input class="in" name="n" required autocomplete="name"></label>
    <button class="btn primary block" style="margin-top:14px">Ask to join</button></form>
    <button class="btn ghost block" id="out" style="margin-top:8px">Sign out</button></div></div>`;
  $('#f').onsubmit = e => { e.preventDefault(); enter(e.target.n.value.trim()); };
  $('#out').onclick = () => sb.auth.signOut({ scope: 'local' });
}
function renderWaiting(crew) {
  $('#app').innerHTML = `<div class="gate">${BRAND}
    <div class="card"><h2>Waiting for approval</h2>
    <p class="muted">Your request to join ${esc(crew || 'the crew')} is in. You'll get access as soon as an admin approves it.</p>
    <div class="btns" style="margin-top:12px"><button class="btn" id="re">Check again</button><button class="btn ghost" id="out">Sign out</button></div></div></div>`;
  $('#re').onclick = () => enter(); $('#out').onclick = () => sb.auth.signOut({ scope: 'local' });
}
function renderBlocked(st) {
  $('#app').innerHTML = `<div class="gate"><div class="card"><h2>No access</h2>
    <p class="muted">${st === 'retired' ? 'This account belongs to a retired member. Ask Personnel if you want to come back.' : "This account doesn't have access to the crew."}</p>
    <button class="btn" id="out">Sign out</button></div></div>`;
  $('#out').onclick = () => sb.auth.signOut({ scope: 'local' });
}

/* ---------- data ---------- */
async function loadAll() {
  const c = S.crew.id;
  const since = new Date(Date.now() - 400 * 86400000).toISOString().slice(0, 10);
  const [sess, ev, pl, pe, rs, ep, an, gb, fb, sp, cs, ef] = await Promise.all([
    rpc('my_session', { p_crew: c }),
    sb.from('events_full').select('*').eq('crew_id', c).gte('event_date', since).order('event_date').order('call_time', { nullsFirst: false }),
    sb.from('places').select('*').eq('crew_id', c).order('name'),
    sb.from('people').select('id,full_name,callsign,title,status,abilities,member_since,rookie_since,eligible_date,city,show_on_map,user_id,created_at').eq('crew_id', c).order('full_name'),
    sb.from('rsvps').select('*').eq('crew_id', c),
    sb.from('event_places').select('*').eq('crew_id', c).order('sort'),
    sb.from('announcements').select('*').eq('crew_id', c).order('created_at', { ascending: false }).limit(10),
    sb.rpc('giveback_for_crew', { p_crew: c }),
    sb.rpc('fundraising_board', { p_crew: c, p_year: Number(todayISO().slice(0, 4)) }),
    sb.rpc('crew_contacts', { p_crew: c }).then(r => r.error ? sb.rpc('shared_phones', { p_crew: c }) : r),
    sb.rpc('crew_settings', { p_crew: c }),
    sb.from('event_files').select('*').eq('crew_id', c).order('created_at')
  ]);
  S.appAdmin = sess.app_admin; S.me = sess.person; S.priv = sess.private || {}; S.dues = sess.dues || {}; S.profile = sess.profile || {};
  if (S.me && !['active', 'rookie'].includes(S.me.status)) S.me = null;
  S.events = ev.data || []; S.places = pl.data || []; S.people = pe.data || []; S.rsvps = rs.data || []; S.eplaces = ep.data || []; S.files = (ef && ef.data) || []; S.announcements = an.data || []; S.gb = (gb && gb.data) || null; S.board = (fb && fb.data) || []; S.settings = (cs && cs.data) || {}; S.contacts = Object.fromEntries(((sp && sp.data) || []).map(x => [x.person_id, x])); S.phones = Object.fromEntries(Object.values(S.contacts).filter(x => x.phone).map(x => [x.person_id, x.phone]));
}
async function refresh() { await loadAll(); render(); }

const TABS = [['home', 'Home'], ['chat', 'Chat'], ['crew', 'Crew'], ['me', 'Me'], ['team', 'Admin']];

    <header class="top"><div class="bar">
      <button class="brand" id="brand" title="Busters home" aria-label="Busters home"><img class="bmk" src="icons/icon-192.png?v=4" alt=""><span class="bdiv"></span><img class="logo" src="img/wordmark-wide.png" alt="The Los Angeles Ghostbusters"></button>
      <div class="sp"></div>
      <button class="iconbtn cyc" id="pk" title="Proton Pack Diagnostics" aria-label="Proton Pack Diagnostics">${ICON.pack}</button>

  $('#brand').onclick = () => { document.body.classList.remove('chatting'); S.tab = 'home'; S.view = null; render(); scrollTo(0, 0); };
  $('#menu').onclick = openMenu; $('#qr').onclick = openQR; $('#pk').onclick = openPack;
  render();
}
function teamCount() {
  const ev = can('add_events') || can('edit_events'); const up = upcoming().filter(e => e.status === 'scheduled');
  return (can('approve_members') ? S.people.filter(p => p.status === 'pending').length : 0)
    + (can('manage_proposals') ? S.events.filter(e => e.status === 'proposed').length : 0)
    + (ev ? up.filter(isShort).length + up.filter(e => e.missing.length).length : 0)
    + (can('pick_attendees') ? up.filter(e => e.max_busters && e.going > 0 && e.spots_in < e.max_busters).length : 0)
    + (can('crew_admin') ? S.events.filter(e => e.status !== 'cancelled' && Number(e.raised) > 0 && !e.credit_published).length : 0);
}
function renderTabs() {
  if (!$('#tabs')) return;
  const tabs = TABS.filter(([k]) => k !== 'team' || onTeam());
  const tc = teamCount(); const wc = upcoming().filter(isWaiting).length; const cc = (S.chat && S.chat.unread) || 0;
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${S.tab === k && (!S.view || (k === 'chat' && document.body.classList.contains('chatting'))) ? 'on' : ''}" data-t="${k}">${ICON[k]}<span>${l}</span>${k === 'team' && tc ? `<b class="badge">${tc}</b>` : ''}${k === 'home' && wc ? `<b class="badge pulse" title="${wc} waiting on your answer">${wc}</b>` : ''}${k === 'chat' && cc ? `<b class="badge" title="${cc} chat${cc === 1 ? '' : 's'} with new messages">${cc}</b>` : ''}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { document.body.classList.remove('chatting'); S.tab = b.dataset.t; S.view = null; render(); scrollTo(0, 0); });
}
function render() {
  renderTabs();
  const m = $('#main');
  m.classList.toggle('wideview', !!(S.view && S.wide));   // the event editor uses the full width on a PC
  if (S.view) return S.view();
  ({ home: renderHome, events: renderEvents, me: renderMine, chat: renderChat, crew: renderCrew, team: renderTeam })[S.tab](m);
  syncUrl();
}
// Other screens (editors, profiles) have no address of their own and keep their tab's.
function show(fn, route, wide) { S.viewRoute = route || null; S.wide = !!wide; S.view = () => fn($('#main')); render(); syncUrl(); scrollTo(0, 0); }

/* ---------- addresses ----------
   Each screen has its own address (#crew, #admin/media, #event/<id>, #chat/rookies), so a refresh keeps you where you
   were, the phone's back button goes to the previous screen, and any screen can be linked. */
function routeNow() {
  if (S.view) return S.viewRoute || (S.tab === 'team' ? 'admin/' + S.adminTab : S.tab === 'home' ? '' : S.tab);
  return S.tab === 'team' ? 'admin/' + (S.adminTab || '') : S.tab === 'home' ? '' : S.tab;
}
function syncUrl() {
  const h = routeNow() ? '#' + routeNow().replace(/\/$/, '') : '';
  if (location.hash === h || (!h && !location.hash)) return;
  if (S.popping) history.replaceState(history.state, '', location.pathname + h); else history.pushState({ b: 1 }, '', location.pathname + h);
}
// In-app Back buttons step back through the phone's history when there is a Busters screen to go back to.
function goBack(fallback) { if (history.state && history.state.b) history.back(); else fallback(); }
function applyRoute(hash) {
  const [a, b] = decodeURIComponent((hash || '').replace(/^#/, '')).split('/');
  document.body.classList.remove('chatting');

function renderCal(box) {

  const t = todayISO(); const q = S.evSearch.toLowerCase();

  let cells = ''; const d = new Date(start);
  for (let i = 0; i < 42; i++) {

  box.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn sm" id="pm">${ICON.back}</button><h3 style="flex:1;text-align:center">${firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h3><button class="btn sm" id="nm" style="transform:scaleX(-1)">${ICON.back}</button></div>
    <div class="cal">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<div class="h">${x}</div>`).join('')}${cells}</div>
    <div style="margin-top:14px">${S.calSel ? (sel.length ? sel.map(eventRow).join('') : `<div class="empty">Nothing on ${fmtDay(S.calSel)}.</div>`) : '<p class="muted small">Tap a day to see its events. Green dots are events you are going to.</p>'}</div>`;

    <p class="muted small">It is marked Cancelled for everyone and logged. ${going} ${going === 1 ? 'person has' : 'people have'} signed up. Alerts, the calendar and Discord updates arrive in later builds; for now, let the event contact know yourself.</p>
    ${e.contact_name ? `<div class="card small"><b>${esc(e.contact_name)}</b>${e.contact_phone ? `<br><a href="${tel(e.contact_phone)}">${esc(e.contact_phone)}</a>` : ''}${e.contact_email ? `<br><a href="mailto:${esc(e.contact_email)}">${esc(e.contact_email)}</a>` : ''}</div>` : ''}

      ...(e.extra_times || []).map(x => ({ k: 'x', label: x.label, t: (x.time || '').slice(0, 5) }))];
    const order = () => { const idx = times.map((x, i) => x.t ? i : -1).filter(i => i >= 0); const vals = idx.map(i => times[i]).sort((a, b) => a.t < b.t ? -1 : a.t > b.t ? 1 : 0); idx.forEach((i, n) => { times[i] = vals[n]; }); };
    const TIME_TYPES = ['Call', 'Meet-up', 'Photo op', 'Break', 'Other'];
    let picking = false;

      const nm = { call: 'call_time', start: 'start_time', wrap: 'wrap_time' };

        ${isImg(f) && !f.is_flyer ? `<button type="button" class="btn sm ghost" data-fly="${f.id}">Use as flyer</button>` : ''}<button type="button" class="btn sm ghost" data-rmf="${f.id}">Remove</button></div>`).join('') || '<div class="small dim" style="margin-top:8px">No attachments yet.</div>';
      box.querySelectorAll('[data-fly]').forEach(b => b.onclick = async () => { await rpc('set_event_flyer', { p_id: b.dataset.fly }); await reloadFiles(); drawAtts(); sb.rpc('refresh_event_card', { p_event: e.id }).then(() => {}); toast('Flyer set'); });
      box.querySelectorAll('[data-rmf]').forEach(b => b.onclick = async () => { if (!confirmBox('Remove this attachment?')) return; const path = await rpc('remove_event_file', { p_id: b.dataset.rmf }); if (path) await sb.storage.from('event-files').remove([path]); await reloadFiles(); drawAtts(); sb.rpc('refresh_event_card', { p_event: e.id }).then(() => {}); toast('Removed'); });
    };
    drawAtts();
    const ain = $('#attin'); if (ain) ain.onchange = async () => {
      const files = [...ain.files]; ain.value = '';
      for (const file of files) {
        if (file.size > 20 * 1048576) { toast(file.name + ' is over 20 MB'); continue; }
        const safe = file.name.replace(/[^\w.\-]+/g, '_').slice(-80) || 'file';
        const path = `${S.crew.id}/${e.id}/${Math.random().toString(36).slice(2, 10)}-${safe}`;
        toast('Uploading ' + file.name + '...');
        const { error } = await sb.storage.from('event-files').upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
        if (error) { toast('Could not upload ' + file.name + ': ' + error.message); continue; }

    };
    $('#addpl').onclick = () => { pls.push({ label: 'Parking', name: '', address: '' }); drawPls(); };
    const leave = () => isNew ? (S.view = null, render()) : openEvent(e.id);

    const del = $('#del'); if (del) del.onclick = async () => { if (!confirmBox('Delete this event for good? Use Cancel instead if it was called off.')) return; await rpc('delete_event', { p_event: e.id }); await refresh(); S.view = null; S.tab = 'home'; render(); toast('Deleted'); };

    $('#ef').onsubmit = async ev => {
      ev.preventDefault();
      const fd = new FormData(ev.target); const p = {};

      if (propose) p.status = 'proposed';

      if ($('#eok')) p.details_ok = $('#eok').checked;
      if (!times.some(x => x.k === 'call')) p.call_time = '';
      p.extra_times = times.filter(x => x.k === 'x' && x.t).map(x => ({ label: x.label, time: x.t }));
      if (p.date_tbd && p.event_date) p.event_date = p.event_date.slice(0, 8) + '01';
      ev.target.querySelector('button.primary').disabled = true;
      try {
        const id = await rpc('save_event', { p_crew: S.crew.id, p });
        if (!propose || pls.some(x => x.name || x.address)) await rpc('set_event_places', { p_event: id, p_places: pls.filter(x => x.name || x.address || x.place_id) });

        if (propose) { S.view = null; render(); toast('Thanks! The events team will take a look.'); }
        else { sb.rpc('refresh_event_card', { p_event: id }).then(() => {}); openEvent(id); toast('Saved'); }
      } catch (err) { ev.target.querySelector('button.primary').disabled = false; }
    };
  }, null, true);
}

/* ---------- Me tab (your record, details and settings) ---------- */
// Personal stats list for the Me tab: this year against the yearly minimum, lifetime counts, money raised, and the crew's Give Back standing.
function myStats(past, hosp) {
  const yr = todayISO().slice(0, 4);
  const myYr = S.events.filter(e => e.status !== 'cancelled' && e.event_date.startsWith(yr) && (myRsvp(e.id) || {}).answer === 'going');
  const done = myYr.filter(e => e.event_date < todayISO()).length, soon = myYr.length - done, MIN = 2;
  const pips = Array.from({ length: MIN }, (_, i) => `<i class="${i < done ? 'f' : i < done + soon ? 'r' : ''}"></i>`).join('');
  const g = S.gb, raised = myRaised();
  const gbSub = g && g.amount != null ? [`#${g.rank} of ${g.groups} crews`, g.goal ? Math.round(100 * g.amount / g.goal) + '% of the ' + money0(g.goal) + ' goal' : ''].filter(Boolean).join(' · ') : 'Waiting on Sony\'s numbers';
  const row = (k, sub, v, id) => `<${id ? `a href="#" id="${id}"` : 'div'} class="stat${id ? ' go' : ''}"><div class="grow"><div>${k}</div>${sub ? `<div class="small muted">${sub}</div>` : ''}</div><div class="sv">${v}</div><span class="muted ch">${id ? '›' : ''}</span></${id ? 'a' : 'div'}>`;
  return `<div class="card stats${done >= MIN ? ' met' : ''}">
    ${row(`Events in ${yr}`, `<span class="pips">${pips}</span>${done >= MIN ? 'Yearly minimum met' : `${MIN} a year minimum`}${soon ? ` · ${soon} more signed up` : ''}`, done)}
    ${row('All events', '', past.length)}
    ${row('Hospital visits', '', hosp.length)}
    ${row(`Raised in ${yr}`, 'Fundraising credited to you', money0(raised), 'myraised')}
    ${row(`${esc(S.crew.short || 'Crew')} on Give Back`, gbSub, g && g.amount != null ? money0(g.amount) : '-', 'mygb')}
  </div>`;
}
function renderMine(m) {
  const t = todayISO();
  const mineUp = S.events.filter(e => (e.end_date || e.event_date) >= t && e.status !== 'proposed' && ['going', 'maybe'].includes((myRsvp(e.id) || {}).answer));

// Reading and sending go through the busters-chat edge function. Messages written here post into Discord under
// the member's own name and picture. Nothing here links back to the app from Discord.
S.chat = { list: null, crewCh: null, events: new Set(), joined: new Set(), unread: 0, at: 0 };
async function chatCall(body, form) {
  const { data } = await sb.auth.getSession();
  const tok = data && data.session ? data.session.access_token : '';
  const h = { apikey: SB_KEY, Authorization: 'Bearer ' + tok };
  if (!form) h['Content-Type'] = 'application/json';
  const r = await fetch(SB_URL + '/functions/v1/busters-chat', { method: 'POST', headers: h, body: form || JSON.stringify({ crew: S.crew.id, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Chat error ' + r.status); e.retry = !!j.retry || r.status === 429; throw e; }
  return j;
}
// Events whose chat shows in the list: upcoming ones you said Going or Maybe to, then ones you went to in the last 2 weeks,
// plus any event whose Discord thread you're in.
function chatEventList() {
  const t = todayISO(), ago = new Date(Date.now() - 14 * 86400000).toISOString().slice(0, 10);
  // Webmasters and crew admins are in every event thread on Discord, so they see every event chat here too.
  const all = can('webmaster') || can('crew_admin');
  const ans = e => (myRsvp(e.id) || {}).answer;
  const inThread = e => S.chat.joined && S.chat.joined.has(e.id);
  const up = S.events.filter(e => S.chat.events.has(e.id) && (e.end_date || e.event_date) >= t && e.status !== 'proposed' && (all || inThread(e) || ['going', 'maybe'].includes(ans(e))));
  const past = S.events.filter(e => S.chat.events.has(e.id) && (e.end_date || e.event_date) < t && e.event_date >= ago && (all || inThread(e) || ans(e) === 'going')).reverse();
  return { up, past };
}
async function chatRefresh(force) {
  if (!force && S.chat.list && Date.now() - S.chat.at < 60000) return;
  try {
    const ev = await sb.rpc('chat_events', { p_crew: S.crew.id });
    S.chat.events = new Set((ev.data || []).map(x => x.event_id));
    S.chat.joined = new Set((ev.data || []).filter(x => x.joined).map(x => x.event_id));
    const { up, past } = chatEventList();
    const j = await chatCall({ action: 'overview', events: [...up, ...past].map(e => e.id) });
    S.chat.list = j.chats; S.chat.crewCh = j.crew_channel; S.chat.at = Date.now();
    S.chat.unread = j.chats.filter(c => c.unread).length;
  } catch (e) { if (!S.chat.list) S.chat.list = []; S.chat.err = e.message; }
  if (!S.view) render(); else renderTabs();
}
setInterval(() => { if (S.crew && S.me && document.visibilityState === 'visible') chatRefresh(); }, 120000);

async function chatView(m, e, channel) {
  const st = { msgs: [], me: S.me.id, more: false, timer: null, busy: false, files: [], alive: true };
  m.innerHTML = `<div class="chead"><button class="back" id="bk" style="margin:0">${ICON.back}</button>
      ${e ? dateBox(e, 'sm') : '<div class="chav sm"><img src="img/emblem.png" alt=""></div>'}

  $('#bk', m).onclick = () => { stop(); goBack(() => { S.view = null; S.tab = 'chat'; render(); scrollTo(0, 0); }); };
  const br = $('#brief', m); if (br) br.onclick = () => { stop(); openEvent(e.id); };
  if (!channel) {
    try { const j = await chatCall({ action: 'overview', events: e ? [e.id] : [] }); const k = j.chats.find(c => (c.event_id || null) === (e ? e.id : null)); channel = k && k.channel; } catch (x) { /* shown below */ }
    if (!channel) { box.innerHTML = `<div class="empty">${e ? "This event doesn't have a Discord thread yet. It gets one when its first card posts." : 'Chat is not available right now.'}</div>`; $('#comp', m).hidden = true; return; }
  }
  const atBottom = () => scrollY + innerHeight >= document.documentElement.scrollHeight - 140;
  const draw = (stick) => {
    let day = '';
    box.innerHTML = (st.more ? '<button class="btn sm ghost" id="older" style="display:block;margin:6px auto 4px">Load earlier messages</button>' : '')
      + (st.msgs.length ? '' : '<div class="empty">No messages yet. Say hi.</div>')
      + st.msgs.map(x => { const d = new Date(x.ts).toDateString(); const sep = d !== day ? `<div class="day">${new Date(x.ts).toDateString() === new Date().toDateString() ? 'Today' : new Date(x.ts).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })}</div>` : ''; day = d; return sep + chatMsg(x, st.me); }).join('');
    const o = $('#older', box); if (o) o.onclick = older;
    box.querySelectorAll('img[data-full]').forEach(i => i.onclick = () => window.open(i.dataset.full, '_blank', 'noopener'));
    if (stick) requestAnimationFrame(() => scrollTo(0, document.documentElement.scrollHeight));
  };
  async function older() {
    try { const j = await chatCall({ action: 'messages', channel, before: st.msgs[0].id }); const h = document.documentElement.scrollHeight; st.msgs = j.messages.concat(st.msgs); st.more = j.more; draw(false); scrollTo(0, scrollY + document.documentElement.scrollHeight - h); } catch (x) { toast(x.message); }
  }
  async function poll(first) {
    if (!st.alive || !document.body.contains(box)) return stop();
    let wait = 5000;
    if (document.visibilityState === 'visible' && !st.busy) {
      try {
        const last = st.msgs.length ? st.msgs[st.msgs.length - 1].id : null;
        const j = await chatCall({ action: 'messages', channel, after: first ? undefined : last });
        if (first) { st.msgs = j.messages; st.more = j.more; draw(true); }

        const c = (S.chat.list || []).find(c => c.channel === channel); if (c && c.unread) { c.unread = false; S.chat.unread = Math.max(0, S.chat.unread - 1); renderTabs(); }

    for (const f of [...ev.target.files].slice(0, 6 - st.files.length)) { const blob = await shrinkPhoto(f); st.files.push({ blob, name: (f.name || 'photo').replace(/\.\w+$/, '') + '.jpg', prev: URL.createObjectURL(blob) }); }
    ev.target.value = ''; showFiles();
  };
  async function sendIt() {
    const text = ta.value.trim(); if ((!text && !st.files.length) || st.busy) return;
    st.busy = true; $('#csend', m).disabled = true;
    const fd = new FormData(); fd.append('action', 'send'); fd.append('crew', S.crew.id); fd.append('channel', channel); fd.append('text', text);
    st.files.forEach(f => fd.append('files', f.blob, f.name));
    try {
      const j = await chatCall(null, fd);
      ta.value = ''; grow(); st.files = []; showFiles();
      if (!st.msgs.some(x => x.id === j.message.id)) st.msgs.push(j.message);
      draw(true);
    } catch (x) { toast(x.message); }
    st.busy = false; $('#csend', m).disabled = false;
  }
  $('#csend', m).onclick = sendIt;
  poll(true);
}
function chatMsg(x, me) {
  const mine = x.person_id && x.person_id === me && x.kind !== 'bot';
  const time = new Date(x.ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  const text = x.text ? `<div class="b pre">${linkify(x.text)}</div>` : '';
  const media = (x.media || []).map(g => g.type === 'video' ? `<video src="${esc(g.url)}"${g.poster ? ` poster="${esc(g.poster)}"` : ''} autoplay loop muted playsinline></video>` : `<img src="${esc(g.url)}" data-full="${esc(g.link || g.url)}" alt="" loading="lazy">`).join('');
  const gif = media ? `<div class="ph gif">${media}</div>` : '';
  if (x.kind === 'bot') return `<div class="botc"><div class="tiny dim" style="margin-bottom:3px">${esc(x.name)} · ${time}</div>${text}${gif}${x.cards.map(c => `<div>${c.title ? `<b>${esc(c.title)}</b>` : ''}${c.text ? `<div class="small pre">${linkify(c.text)}</div>` : ''}</div>`).join('')}${files}</div>`;
  if (mine) return `<div class="m me"><div class="bub">${text}${gif}${files}<div class="tiny dim" style="text-align:right;margin-top:3px">${time}${x.kind === 'app' ? ' · sent to Discord ✓' : ''}</div></div></div>`;
  const av = x.avatar ? `<img class="a" src="${esc(x.avatar)}" alt="">` : `<div class="a" style="background:${chatColor(x.name)}">${esc(initials(x.name))}</div>`;
  return `<div class="m">${av}<div style="min-width:0"><div class="who">${esc(x.name)}<span>${time}</span>${x.kind === 'member' || x.kind === 'other' ? '<span class="dc">Discord</span>' : ''}${x.edited ? '<span>(edited)</span>' : ''}</div>${text}${gif}${files}</div></div>`;
}
const chatColor = n => ['#f7e3a0', '#4ade80', '#ff8c78', '#35b2e8', '#9b6fb0', '#ff5e86', '#3ba7c0'][[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % 7];
async function shrinkPhoto(f) {
  try {
    const bmp = await createImageBitmap(f); const k = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || f), 'image/jpeg', 0.86));
  } catch (e) { return f; }
}

async function drawMemberMap() {

async function discordCheck() {
  const msg = $('#dc-msg'); if (msg) msg.textContent = 'Checking with Discord...';
  try {
    const { data } = await sb.auth.getSession();
    const res = await fetch(SB_URL + '/functions/v1/busters-discord', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + data.session.access_token }, body: JSON.stringify({ crew: S.crew.id }) });
    const r = await res.json();
    if (r.error) toast(r.error); else if (r.channel_error) toast(r.channel_error); else if (r.channel) toast('Connected to #' + r.channel);
  } catch (_) { toast('Could not reach Discord. Try again.'); }
  wireDiscord();
}

  on2('#me-link', async () => { try { await navigator.clipboard.writeText(m.request_url); toast('Upload link copied'); } catch (e) { prompt('Upload link', m.request_url); } });

        const pills = [k.has('short') ? `<span class="pill bad">Short: ${e.going} of ${e.min_busters} minimum</span>` : '',

      : `<div class="sec">${list(pending.map(p => item('Wants to join', p.full_name, 'Asked ' + (p.created_at ? new Date(p.created_at).toLocaleDateString() : 'recently'), `data-join="${p.id}"`, 'Review')))}</div>`,
    media: () => `<div class="sec" id="mediabox"><div class="empty">Loading...</div></div>`,

    app: () => `<div class="small muted" style="margin:-4px 0 4px">Only app admins see this.</div>${adoptionCard()}<div class="btns"><button class="btn sm" id="log">Action log</button></div><div class="sec" id="discord"></div><div class="sec" id="mediasetup"><div class="empty">Loading...</div></div><div class="sec small" id="bridge"></div>`,
    crew: () => `${can('crew_admin') ? `<div class="sec">${list(unpublished.map(e => item('Publish credit', e.title, `${fmtDay(e.event_date)} · ${money0(e.raised)} raised, split is a draft`, `data-ev="${e.id}"`, 'Review')))}</div>`
        + goalCard() + '<div class="sec" id="donatecodes"></div>' : ''}`
  };
  m.innerHTML = `<div class="sec"><h2>Admin ${at === 'events' && ev ? '<button class="btn sm primary act" id="new">+ New event</button>' : ''}</h2>
</div>
    ${dash.length > 1 ? `<div class="chips adtabs" id="adtabs">${dash.map(([k, l, n]) => `<button class="chip ${k === at ? 'on' : ''}" data-ad="${k}">${l}${n ? ` <b class="badge" style="position:static;display:inline-grid;margin-left:4px">${n}</b>` : ''}</button>`).join('')}</div>` : ''}
    ${dash.length ? body[at]() : '<div class="empty">Nothing here for you yet.</div>'}`;
  m.querySelectorAll('[data-ad]').forEach(b => b.onclick = () => { S.adminTab = b.dataset.ad; renderTeam(m); syncUrl(); scrollTo(0, 0); });
  const nw = $('#new'); if (nw) nw.onclick = () => editEvent(null);
  if ($('#dcsched')) scheduleCard($('#dcsched'));
  if ($('#mediabox')) mediaCard($('#mediabox'));
  if ($('#plist')) personnelList($('#plist'));
  if ($('#mediasetup')) mediaCard($('#mediasetup'), 'setup');
  if ($('#donatecodes')) donateCodesCard($('#donatecodes'));
  const gbs = $('#gb-save'); if (gbs) gbs.onclick = async () => {
    const num = id => { const v = $(id).value.trim(); return v === '' ? null : Number(v); };
    const goal = num('#gb-goal'), last = num('#gb-last');
    if (goal == null && last == null) return toast('Enter a goal or last drive\'s total.');
    await rpc('set_giveback_goal', { p_crew: S.crew.id, p_goal: goal, p_last_total: last, p_ends: $('#gb-ends').value || null });
    await refresh(); toast('Goal saved');
  };
  if ($('#bridge')) rpc('bridge_status', { p_crew: S.crew.id }).then(b => {
    if (!b || !$('#bridge')) return;
    const ago = x => x ? Math.round((Date.now() - new Date(x.at)) / 60000) : null;
    const line = (label, x, okMin) => `<div>${label}: ${x ? `<span class="${ago(x) > okMin ? 'muted' : ''}">${ago(x) < 60 ? ago(x) + ' min ago' : Math.round(ago(x) / 60) + ' h ago'}</span> <span class="dim">(${esc(x.summary)})</span>` : '<span class="muted">not connected yet</span>'}</div>`;
    $('#bridge').innerHTML = '<h2>Google bridge</h2>' + line('Google Calendar sync', b.calendar, 20) + line('Sheet sync', b.sheet, 130);
  }).catch(() => {});
  wireDiscord();
  const lg = $('#log'); if (lg) lg.onclick = () => show(renderLog);
  wireRows(m);
  m.querySelectorAll('[data-join]').forEach(r => r.onclick = () => reviewJoin(personById(r.dataset.join)));
  m.querySelectorAll('[data-fin]').forEach(r => r.onclick = ev => { ev.stopPropagation(); finishEvent(r.dataset.fin); });
  m.querySelectorAll('[data-prop]').forEach(r => r.onclick = ev => { ev.stopPropagation(); reviewProposal(S.events.find(e => e.id === r.dataset.prop)); });
}

  ['admin', 'Crew admin', 'Everything for the crew, including Fundraising and announcements', ['crew_admin']]
];
function reviewJoin(p) {
  sheet(`<h3>${esc(p.full_name)} wants to join</h3><p class="muted small">Approve with a starting preset. You can fine-tune abilities later from Crew.</p>
    <div class="seg" id="ps">${PRESETS.map((x, i) => `<button class="${i === 0 ? 'on' : ''}" data-v="${x}">${x === 'Events team' ? 'Events' : x}</button>`).join('')}</div>
    <div class="btns" style="margin-top:14px"><button class="btn primary" id="ok">Approve</button><button class="btn danger" id="no">Decline</button><button class="btn ghost" data-close>Later</button></div>`, s => {
    let preset = 'Member';

    $('#ok', s).onclick = async () => { await rpc('decide_member', { p_person: p.id, p_approve: true, p_preset: preset }); closeSheet(); toast('Approved'); refresh(); };
    $('#no', s).onclick = async () => { if (!confirmBox('Decline ' + p.full_name + '?')) return; await rpc('decide_member', { p_person: p.id, p_approve: false, p_preset: null }); closeSheet(); refresh(); };

}
function reviewProposal(e) {
  sheet(`<h3>${esc(e.title)}</h3><div class="muted small">${fmtDay(e.event_date)} · suggested by ${esc(nameOf(personById(e.proposed_by)))}</div>

    <div class="btns" style="margin-top:14px"><button class="btn primary" id="take">Make it an event</button><button class="btn danger" id="close">Close it</button><button class="btn ghost" data-close>Later</button></div>`, s => {
    $('#take', s).onclick = async () => { await rpc('set_event_status', { p_event: e.id, p_status: 'scheduled', p_reason: 'from a proposal' }); closeSheet(); await refresh(); editEvent(S.events.find(x => x.id === e.id)); };
    $('#close', s).onclick = async () => { await rpc('set_event_status', { p_event: e.id, p_status: 'closed', p_reason: 'proposal closed' }); closeSheet(); refresh(); };

// Status is where someone is in membership; roles are what they can do. Both are set from Edit.
let rosterData = [], rosterQ = '', rosterF = 'current', rosterOpen = new Set();
const STATUS = [['pending', 'Waiting', 'cyan'], ['rookie', 'Rookie', 'cream'], ['active', 'Member', 'good'], ['retired', 'Retired', ''], ['removed', 'Removed', 'bad']];
const statusPill = s => { const x = STATUS.find(t => t[0] === s) || [s, s, '']; return `<span class="pill ${x[2]}">${esc(x[1])}</span>`; };
const hasRole = (p, r) => r[3].some(a => (p.abilities || []).includes(a));
const fullRole = (p, r) => r[3].every(a => (p.abilities || []).includes(a));
const roleTags = p => (p.abilities || []).includes('crew_admin') ? '<span class="rtag adm">Crew admin</span>'
  : ROLES.filter(r => r[0] !== 'admin' && fullRole(p, r)).map(r => `<span class="rtag">${r[1]}</span>`).join('');
// Dues, in Personnel's own words: Paid, Not paid, Extension (given more time), Exempt (doesn't owe). A year with
// nothing entered shows "Not set". "PAID in 2024" counts as Paid; an old "N/A" counts as Exempt.
const DUES = [['', 'Not set', ''], ['PAID', 'Paid', 'good'], ['UNPAID', 'Not paid', 'warn'], ['EXTENSION', 'Extension', 'cyan'], ['EXEMPT', 'Exempt', 'cream']];
const duesKey = s => !s ? '' : /^paid/i.test(s) ? 'PAID' : /exempt|^n\/?a$/i.test(s) ? 'EXEMPT' : /extension|grace/i.test(s) ? 'EXTENSION' : /unpaid|not paid/i.test(s) ? 'UNPAID' : s;
const duesPill = s => { const k = duesKey(s), d = DUES.find(x => x[0] === k) || [k, s, '']; return k ? `<span class="pill ${d[2]}">${esc(d[1])}</span>` : '<span class="pill na">Not set</span>'; };

let regChecks = {}; const megEdit = new Set();
async function personnelList(box) {
  try { rosterData = await rpc('personnel_roster', { p_crew: S.crew.id }); } catch (e) { box.innerHTML = '<div class="empty">The Personnel list could not load right now.</div>'; return; }
  // Registry checks for applicants (Waiting). Only the outcome, who and when are kept, never what was found.
  const { data: rc } = await sb.rpc('registry_checks_for', { p_crew: S.crew.id }); regChecks = Object.fromEntries((rc || []).map(r => [r.person_id, r]));
  const yr = +todayISO().slice(0, 4);
  const bday = b => b ? fmtDay('2000-' + b, { month: 'short', day: 'numeric' }) : '';
  const line = (k, v) => v ? `<div class="kv"><span>${k}</span><b>${v}</b></div>` : '';
  // Megan's (registry) status: Pass, Fail, or Check (not looked up yet). Only the result, who and when are kept.
  const megans = p => { const r = regChecks[p.id]; const k = !r ? 'check' : r.outcome === 'clear' ? 'pass' : 'fail';
    const meta = !r ? 'Not checked yet' : r.before_busters ? 'Before Busters' : esc(new Date(r.checked_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })) + ' by ' + esc(r.checked_by || 'Personnel');
    const pill = `<span class="pill ${k === 'pass' ? 'good' : k === 'fail' ? 'bad' : 'warn'}">${k === 'pass' ? 'Pass' : k === 'fail' ? 'Fail' : 'Check'}</span>`;
    return `<div class="kv" style="align-items:center"><span>Megan's</span><b style="display:inline-flex;align-items:center;gap:6px">${megEdit.has(p.id)
        ? `<span class="mseg">${[['pass', 'Pass'], ['fail', 'Fail'], ['check', 'Check']].map(([v, l]) => `<button type="button" class="${k === v ? 'on ' + v : ''}" data-meg="${p.id}:${v}">${l}</button>`).join('')}</span><button type="button" class="medit" data-megx="${p.id}" aria-label="Done">&#10005;</button>`
        : `${pill}<button type="button" class="medit" data-megx="${p.id}" title="Change Megan's status" aria-label="Change Megan's status">${PEN}</button>`}</b></div>
      <div class="tiny ${k === 'check' ? '' : 'dim'}" style="text-align:right;${k === 'check' ? 'color:var(--warn)' : ''}">${meta}${megEdit.has(p.id) ? ' · Check copies the name and opens the search. Also check <a href="https://www.nsopw.gov/search-public-sex-offender-registries" target="_blank" rel="noopener">NSOPW</a>.' : ''}</div>`; };
  const detail = p => `<div class="pdet">
      <div class="pgrp"><div class="gc-lbl">Names and accounts</div>
        ${line('Real name', esc(p.full_name))}${line('Callsign', esc(p.callsign || ''))}
        ${line('Discord', p.discord ? esc(p.discord) + (p.discord_linked ? ' <span class="tiny" style="color:var(--good)">linked</span>' : ' <span class="tiny dim">not linked</span>') : '<span class="dim">none</span>')}
        ${line('Sign-in email', p.login_email ? esc(p.login_email) : '<span class="dim">hasn\'t signed in to Busters</span>')}
        ${p.email && p.email !== p.login_email ? line('Roster email', esc(p.email)) : ''}
        ${line('Nicknames', (p.aliases || []).length ? p.aliases.map(esc).join(', ') : '<span class="dim">none</span>')}</div>
      <div class="pgrp"><div class="gc-lbl">Contact</div>
        ${line('Phone', p.phone ? `<a href="${tel(p.phone)}">${esc(p.phone)}</a>` : '')}${line('Instagram', esc(p.instagram || ''))}${line('Birthday', bday(p.birthday))}${line('City', esc(p.city || ''))}
        ${!p.phone && !p.instagram && !p.birthday && !p.city ? '<div class="tiny dim">Nothing on file.</div>' : ''}</div>
      <div class="pgrp"><div class="gc-lbl">Membership</div>
        ${line('Role in crew', esc(p.title || ''))}${line('Member since', p.member_since ? esc(fmtDay(p.member_since, { month: 'short', year: 'numeric' })) : '')}
        ${p.status === 'rookie' ? line('Rookie', `${(p.rookie_events_before || 0) + p.events_done} of 4 events${p.eligible_date ? ', eligible ' + esc(p.eligible_date) : ''}`) : line('Rookie since', esc(p.rookie_since || ''))}
        ${line(`Events in ${yr}`, String(p.events_year || 0))}
        <div class="kv"><span>Dues ${yr}</span><b>${duesPill(p.dues[yr])}</b></div>
        <div class="kv"><span>Dues ${yr - 1}</span><b>${duesPill(p.dues[yr - 1])}</b></div>
        ${megans(p)}</div>
    </div>`;
  const draw = () => {
    const q = rosterQ.toLowerCase();
    const rows = rosterData.filter(p => (rosterF === 'all' || (rosterF === 'current' ? ['active', 'rookie', 'pending'].includes(p.status) : p.status === rosterF)) &&
      (!q || [p.full_name, p.callsign, p.title, p.email, p.login_email, p.discord, p.phone, ...(p.aliases || [])].join(' ').toLowerCase().includes(q)));
    $('#pl').innerHTML = (rows.length ? `<div class="pgrid phead"><span></span><span>Name</span><span>Status</span><span class="pc-roles">Roles</span><span>Dues ${yr}</span><span></span></div>` : '')
      + rows.map(p => `<div class="prow${rosterOpen.has(p.id) ? ' open' : ''}" data-pr="${p.id}">
        <div class="pgrid"><button class="pexp" data-px="${p.id}" aria-expanded="${rosterOpen.has(p.id)}" aria-label="Show details for ${esc(p.full_name)}">›</button>
          <div data-px="${p.id}" style="cursor:pointer;min-width:0"><div class="pname">${esc(p.full_name)}</div>${roleTags(p) ? `<div class="ptags pc-roles-m">${roleTags(p)}</div>` : ''}</div>
          <div>${statusPill(p.status)}${p.status === 'pending' ? (regChecks[p.id] ? (regChecks[p.id].outcome === 'clear' ? '<div class="tiny" style="color:var(--good);margin-top:3px">Megan\'s: pass</div>' : '<div class="tiny" style="color:var(--bad);margin-top:3px">Megan\'s: fail</div>') : '<div class="tiny" style="color:var(--warn);margin-top:3px">Megan\'s: check</div>') : ''}</div>
          <div class="ptags pc-roles">${roleTags(p) || '<span class="dim tiny">None</span>'}</div>
          <div>${duesPill(p.dues[yr])}</div>
          <button class="xedit" data-pe="${p.id}" title="Edit" aria-label="Edit ${esc(p.full_name)}">${PEN}</button></div>
        ${rosterOpen.has(p.id) ? detail(p) : ''}</div>`).join('') || '<div class="empty">Nobody matches.</div>';
    $('#pcnt').textContent = rows.length + ' shown';
    box.querySelectorAll('[data-px]').forEach(b => b.onclick = () => { const id = b.dataset.px; rosterOpen.has(id) ? rosterOpen.delete(id) : rosterOpen.add(id); draw(); });
    box.querySelectorAll('[data-pe]').forEach(b => b.onclick = () => editPerson(rosterData.find(x => x.id === b.dataset.pe), () => personnelList(box)));
    box.querySelectorAll('[data-megx]').forEach(b => b.onclick = () => { const id = b.dataset.megx; megEdit.has(id) ? megEdit.delete(id) : megEdit.add(id); draw(); });
    box.querySelectorAll('[data-meg]').forEach(b => b.onclick = async () => { const [id, v] = b.dataset.meg.split(':'); const p = rosterData.find(x => x.id === id); const r = regChecks[id];
      if (v === 'check') {
        if (r && !confirmBox(`Check ${p.full_name} again? This clears the current result.`)) return;
        try { navigator.clipboard.writeText(p.full_name).catch(() => {}); } catch (e) { }
        window.open('https://meganslaw.ca.gov/', '_blank', 'noopener');
        if (r) { await rpc('set_registry_check', { p_person: id, p_outcome: null }); delete regChecks[id]; }
        megEdit.delete(id); toast('Name copied. Accept the site\'s terms, then paste it into the search.'); draw(); return;
      }
      const out = v === 'pass' ? 'clear' : 'review';
      if (r && r.outcome === out) { megEdit.delete(id); draw(); return; }
      await rpc('set_registry_check', { p_person: id, p_outcome: out });
      regChecks[id] = { person_id: id, outcome: out, checked_at: new Date().toISOString(), checked_by: nameOf(S.me), before_busters: false };
      megEdit.delete(id); toast(v === 'pass' ? 'Marked Pass' : 'Marked Fail'); draw(); });
  };
  const waiting = rosterData.filter(p => p.status === 'pending').length;
  box.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px"><input class="in" id="rq" placeholder="Search names, Discord, email, nicknames" style="flex:1;min-width:180px" value="${esc(rosterQ)}"><button class="btn sm primary" id="padd">+ Add person</button><button class="btn sm" id="pexp">Download</button></div>
    <div class="chips">${[['current', 'Current'], ['active', 'Members'], ['rookie', 'Rookies'], ['pending', 'Waiting' + (waiting ? ` (${waiting})` : '')], ['retired', 'Retired'], ['all', 'Everyone']].map(([k, l]) => `<button class="chip ${rosterF === k ? 'on' : ''}" data-rf="${k}">${l}</button>`).join('')}<span class="small muted" id="pcnt" style="align-self:center;margin-left:6px"></span></div>
    <div id="pl" style="margin-top:8px"></div>
    <p class="tiny dim" style="margin-top:10px">Only Personnel and crew admins see this list. Every change and download is logged.</p>`;
  $('#rq', box).oninput = e => { rosterQ = e.target.value; draw(); };
  box.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { rosterF = b.dataset.rf; box.querySelectorAll('[data-rf]').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#padd', box).onclick = () => editPerson(null, () => personnelList(box));
  $('#pexp', box).onclick = exportRoster;
  draw();
}

function editPerson(p, after) {
  const isNew = !p; p = p || { status: 'active', dues: {}, abilities: [], aliases: [] };
  const yr = +todayISO().slice(0, 4);
  const v = k => esc(p[k] == null ? '' : p[k]);
  const statuses = STATUS.filter(([k]) => k === p.status || k !== 'pending');
  const roleOpts = ROLES.map(r => `<label class="rsw"><input type="checkbox" data-role="${r[0]}" ${fullRole(p, r) ? 'checked' : ''}><span><b>${r[1]}</b>${!fullRole(p, r) && hasRole(p, r) ? ' <span class="dim">(some)</span>' : ''}<span class="tiny muted">${esc(r[2])}</span></span></label>`).join('');
  sheet(`<h3>${isNew ? 'Add a person' : esc(p.full_name)}</h3>
    <p class="muted small">${isNew ? 'Adding someone with an email pre-approves them: they get straight in the first time they sign in.' : 'Changes are saved and logged.'}</p>
    <form id="pf">
      <div class="gc-lbl" style="margin-top:6px">Status</div>
      <div class="seg" id="pst">${statuses.map(([k, l]) => `<button type="button" class="${p.status === k ? 'on' : ''}" data-st="${k}">${l}</button>`).join('')}</div>
      <div class="gc-lbl" style="margin-top:14px">Roles</div><div class="rsws">${roleOpts}</div>
      <div class="gc-lbl" style="margin-top:14px">Names and accounts</div>
      <div class="grid2"><label class="f"><span>Real name</span><input class="in" name="full_name" required value="${v('full_name')}"></label><label class="f"><span>Callsign</span><input class="in" name="callsign" value="${v('callsign')}"></label></div>
      <div class="grid2"><label class="f"><span>Discord name</span><input class="in" name="discord" value="${v('discord')}"></label><label class="f"><span>Email</span><input class="in" type="email" name="email" value="${v('email')}"></label></div>
      <label class="f"><span>Nicknames (comma separated)</span><input class="in" id="pal" value="${esc((p.aliases || []).join(', '))}" placeholder="JP, Jaypea"></label>
      <div class="tiny dim">How they show up on the sheet or in Discord, so Busters can match them.</div>
      <div class="gc-lbl" style="margin-top:14px">Contact</div>
      <div class="grid2"><label class="f"><span>Phone</span><input class="in" type="tel" name="phone" value="${v('phone')}"></label><label class="f"><span>Instagram</span><input class="in" name="instagram" value="${v('instagram')}"></label></div>
      <label class="f"><span>Birthday (MM-DD)</span><input class="in" name="birthday" pattern="\\d{2}-\\d{2}" value="${v('birthday')}"></label>
      <div class="gc-lbl" style="margin-top:14px">Membership</div>
      <label class="f"><span>Role in crew</span><input class="in" name="title" value="${v('title')}" placeholder="Buster, Quartermaster..."></label>
      <div class="grid2"><label class="f"><span>Member since</span><input class="in" type="date" name="member_since" value="${v('member_since')}"></label><label class="f"><span>Rookie since</span><input class="in" type="date" name="rookie_since" value="${v('rookie_since')}"></label></div>
      <label class="f"><span>Member eligible</span><input class="in" type="date" name="eligible_date" value="${v('eligible_date')}"></label>
      ${isNew ? '' : `<div class="gc-lbl" style="margin-top:14px">Dues</div><div class="grid2">${[yr - 1, yr].map(y => `<label class="f"><span>${y}</span><select class="in" data-dues="${y}">${DUES.map(([k, l]) => `<option value="${k}" ${duesKey(p.dues[y]) === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`).join('')}</div>`}
      <div class="btns" style="margin-top:16px"><button class="btn primary">Save</button><button type="button" class="btn ghost" data-close>Cancel</button></div>
    </form>`, s => {
    let st = p.status;
    s.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { st = b.dataset.st; s.querySelectorAll('[data-st]').forEach(x => x.classList.toggle('on', x === b)); });
    s.querySelectorAll('[data-dues]').forEach(sel => sel.onchange = async () => { await rpc('set_dues', { p_person: p.id, p_year: +sel.dataset.dues, p_status: sel.value }); p.dues[sel.dataset.dues] = sel.value; toast('Dues saved'); });
    $('#pf', s).onsubmit = async ev => {
      ev.preventDefault();
      const fd = new FormData(ev.target); const body = {}; for (const [k, val] of fd.entries()) body[k] = String(val).trim();
      // Roles: checked bundles on, unchecked bundles off; abilities outside the four roles are kept.
      const inRoles = ROLES.flatMap(r => r[3]);
      let abil = (p.abilities || []).filter(a => !inRoles.includes(a));
      s.querySelectorAll('[data-role]').forEach(c => { const r = ROLES.find(x => x[0] === c.dataset.role); if (c.checked) abil.push(...r[3]); else if (!fullRole(p, r) && hasRole(p, r)) abil.push(...r[3].filter(a => (p.abilities || []).includes(a))); });
      abil = [...new Set(abil)].sort();
      if (p.id === S.me.id && (p.abilities || []).includes('crew_admin') && !abil.includes('crew_admin') && !S.appAdmin && !confirmBox('Remove your own crew admin role?')) return;
      if (p.status === 'pending' && ['active', 'rookie'].includes(st) && (regChecks[p.id] || {}).outcome !== 'clear'
          && !confirmBox(regChecks[p.id] ? `${p.full_name}'s Megan's status is Fail. Approve anyway?` : `${p.full_name} hasn't been checked on Megan's Law yet. Approve anyway?`)) return;
      if (st === 'removed' && p.status !== 'removed' && !confirmBox(`Mark ${body.full_name} as removed? They lose access to Busters.`)) return;
      const aliases = $('#pal', s).value.split(',').map(x => x.trim()).filter(Boolean);
      try {
        if (isNew) body.status = st === 'rookie' ? 'rookie' : 'active'; else body.id = p.id;
        const id = await rpc('save_person', { p_crew: S.crew.id, p: body });
        const pid = p.id || id;
        if (!isNew && st !== p.status) {
          if (p.status === 'pending') {
            if (st === 'removed') await rpc('decide_member', { p_person: pid, p_approve: false, p_preset: null });
            else { await rpc('decide_member', { p_person: pid, p_approve: true, p_preset: 'member' }); if (st !== 'active') await rpc('set_status', { p_person: pid, p_status: st }); }
          } else await rpc('set_status', { p_person: pid, p_status: st });
        }
        if (pid && abil.join() !== [...(p.abilities || [])].sort().join()) await rpc('set_abilities', { p_person: pid, p_abilities: abil });
        if (pid && aliases.join('|') !== (p.aliases || []).join('|')) await rpc('set_aliases', { p_person: pid, p_aliases: aliases });
      } catch (e) { return; }
      closeSheet(); toast('Saved'); await refresh(); if (after) after();
    };
  });
}

const QR_LIB = 'lib/qrcode.js';
const QR_READ = 'lib/jsQR.js';
const loadScript = src => new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = no; document.head.appendChild(t); });
const donateCodes = () => ((S.settings || {}).donate_codes || []).filter(c => c && (c.url || c.img));
async function openQR() {

  sheet(`<div class="qrhead"><h3>Scan to donate</h3><button class="iconbtn" data-close aria-label="Close">&#10005;</button></div>
    <div class="qrtrack" id="qrt">${codes.map((c, i) => `<div class="qrcard">
      <div class="qrbox" id="qrb${i}">${c.url ? '' : `<img src="${esc(c.img)}" alt="QR code for ${esc(c.label)}">`}</div>
      <h2>${esc(c.label)}</h2>${c.sub ? `<div class="muted qrsub">${esc(c.sub)}</div>` : ''}
      ${c.url ? `<div class="qrbtns"><button class="btn sm" data-qcopy="${esc(c.url)}">Copy link</button><a class="btn sm ghost" href="${esc(c.url)}" target="_blank" rel="noopener">Open ↗</a></div>` : ''}
    </div>`).join('')}</div>
`, async s => {
    s.parentNode.classList.add('full');
    s.querySelectorAll('[data-qcopy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.qcopy); toast('Link copied'); } catch (e) { toast(b.dataset.qcopy); } });
    try { await loadScript(QR_LIB); } catch (e) { return toast('Could not load the QR maker. Check your connection.'); }
    codes.forEach((c, i) => { if (!c.url) return; const q = qrcode(0, 'M'); q.addData(c.url); q.make(); $('#qrb' + i, s).innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true }); });
  });
}
let DC = null;
function donateCodesCard(box) {
  if (!DC) DC = JSON.parse(JSON.stringify((S.settings || {}).donate_codes || []));
  const row = (c, i) => `<div class="dcode" data-i="${i}">
    <label class="f" style="margin:0"><span>Name on the code</span><input class="in" data-k="label" maxlength="60" value="${esc(c.label || '')}" placeholder="Donate to LAGB with Zelle"></label>
    <label class="f"><span>Small line underneath (optional)</span><input class="in" data-k="sub" maxlength="90" value="${esc(c.sub || '')}" placeholder="Los Angeles Ghostbusters, a 501(c)(3)"></label>
    <label class="f"><span>Link the QR opens</span><input class="in" data-k="url" inputmode="url" value="${esc(c.url || '')}" placeholder="https://..."></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px">
      <label class="btn sm" style="margin:0">Use a QR picture<input type="file" accept="image/*" data-pic hidden></label>
      ${c.img && !c.url ? '<span class="tiny dim">Using the uploaded picture</span>' : ''}
      <button class="btn sm danger" data-del style="margin-left:auto">Remove</button></div>
  </div>`;
  box.innerHTML = `<h2>Donate QR codes</h2><div class="card">
    <div class="small muted">Shown big when anyone taps the QR button at the top, stacked on one screen. Up to 4 (two fit best on a phone).</div>
    ${DC.map(row).join('')}
    ${DC.length < 4 ? '<button class="btn sm" id="dc-add" style="margin-top:12px">+ Add a code</button>' : ''}
    <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;align-items:center;gap:10px"><span class="tiny muted" style="flex:1">Saves every code above.</span><button class="btn sm primary" id="dc-save">Save</button></div>
    <div class="tiny dim" style="margin-top:8px">Zelle: in the Chase app open Pay &amp; transfer, Zelle, then your QR code, save it as a picture and use "Use a QR picture". Busters reads the link out of it so the code stays sharp.</div>
  </div>`;
  box.querySelectorAll('.dcode').forEach(el => {
    const i = Number(el.dataset.i);
    el.querySelectorAll('[data-k]').forEach(inp => inp.oninput = () => { DC[i][inp.dataset.k] = inp.value.trim(); if (inp.dataset.k === 'url' && inp.value.trim()) delete DC[i].img; });
    $('[data-del]', el).onclick = () => { DC.splice(i, 1); donateCodesCard(box); };
    $('[data-pic]', el).onchange = async ev => { const f = ev.target.files[0]; if (!f) return; const r = await readQrPicture(f); if (!r) return; if (r.url) { DC[i].url = r.url; delete DC[i].img; toast('Link read from the picture'); } else { DC[i].img = r.img; DC[i].url = ''; toast("Couldn't read a link, so the picture itself will be shown"); } donateCodesCard(box); };
  });
  const add = $('#dc-add', box); if (add) add.onclick = () => { DC.push({ label: '', sub: '', url: '' }); donateCodesCard(box); };
  $('#dc-save', box).onclick = async () => {
    const clean = DC.map(c => ({ label: (c.label || '').trim(), sub: (c.sub || '').trim(), ...(c.url ? { url: c.url.trim() } : {}), ...(!c.url && c.img ? { img: c.img } : {}) }));
    await rpc('set_donate_codes', { p_crew: S.crew.id, p_codes: clean });
    DC = null; await refresh(); toast('Codes saved');
  };
}
async function readQrPicture(file) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) { toast("That picture couldn't be opened."); return null; }
  const draw = max => { const k = Math.min(1, max / Math.max(bmp.width, bmp.height)); const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); const x = c.getContext('2d'); x.drawImage(bmp, 0, 0, c.width, c.height); return c; };
  try {
    await loadScript(QR_READ);
    const c = draw(1200), px = c.getContext('2d').getImageData(0, 0, c.width, c.height);
    const hit = jsQR(px.data, c.width, c.height);
    if (hit && /^https:\/\//i.test(hit.data)) return { url: hit.data };
  } catch (e) { /* fall back to the picture */ }
  let img = draw(500).toDataURL('image/png'); if (img.length > 290000) img = draw(500).toDataURL('image/jpeg', .85);
  return { img };
}
